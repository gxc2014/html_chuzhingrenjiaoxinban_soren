<style>

*{

body{

/* 顶部 */
header{

}


/* 控制区 */

.controls{
    background:white;

    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}


select,
input,
button{

    border-radius:8px;

    border:1px solid #ddd;

    font-size:15px;

}


button{

    background:#409eff;

    color:white;

    border:none;

    cursor:pointer;

}



/* 进度 */

.progress{

    background:white;

    margin:15px;

    padding:15px;

    border-radius:15px;

}


.bar{

    height:15px;

    background:#eee;

    border-radius:10px;

    overflow:hidden;

}


.bar div{

    height:100%;

    background:#67c23a;

    width:0%;

}



/* 内容 */

.container{

    padding:15px;

}



.card{

    background:white;

    margin-bottom:15px;

    padding:18px;

    border-radius:15px;

    box-shadow:
    0 3px 10px rgba(0,0,0,.08);

}



.card h3{

    margin:0 0 5px;

}



.author{

    color:#888;

}


.text{

    display:none;

    margin-top:15px;

    line-height:2;

    background:#fafafa;

    padding:15px;

    border-radius:10px;

}


.text.show{

    display:block;

}



.finished{

    border-left:5px solid #67c23a;

}



/* 夜间 */

.dark{

    background:#1e1e1e;

    color:#ddd;

}


.dark .card,
.dark .controls,
.dark .progress{

    background:#2b2b2b;

}


.dark .text{

    background:#333;

}


</style>

</head>

// 加载打卡记录

let saveData=
localStorage.getItem("poems");


if(saveData){

    poems=JSON.parse(saveData);

}




function save(){

localStorage.setItem(
"poems",
JSON.stringify(poems)
);

}




function render(){


let box=
document.getElementById("list");


box.innerHTML="";


let grade=
document.getElementById("gradeSelect").value;


let key=
document.getElementById("search").value;



let arr = poems.filter(p => (grade == "全部" || p.grade == grade) && p.title.includes(key));




document.getElementById("total").innerHTML=
poems.length;



let finish=
poems.filter(p=>p.done).length;



document.getElementById("done").innerHTML=
finish;



document.getElementById("progressBar").style.width=

(poems.length?
finish/poems.length*100:
0)

+"%";




arr.forEach((p,index)=>{


let div=
document.createElement("div");


div.className=
"card "+(p.done?"finished":"");



div.innerHTML=`

<h3>
${p.title}
</h3>


<p class="author">

${p.author}
&nbsp;
${p.grade}

</p>



<button onclick="showText(${index})">

查看全文

</button>


<button onclick="check(${index})">

${p.done?"取消打卡":"✅完成背诵"}

</button>



<div class="text" id="text${index}">

${p.text}

</div>


`;



box.appendChild(div);


});


}




function showText(i){

let e=
document.getElementById("text"+i);

e.classList.toggle("show");

}




function check(i){

poems[i].done=
!poems[i].done;

save();

render();

}




function darkMode(){

document.body.classList.toggle("dark");

}




document
.getElementById("gradeSelect")
.onchange=render;



document
.getElementById("search")
.oninput=render;




render();



</script>
