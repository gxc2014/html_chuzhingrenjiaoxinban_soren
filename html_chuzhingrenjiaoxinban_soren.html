        { grade: "七年级上册", type: "文言文", title: "《世说新语》二则·陈太丘与友期行", author: "刘义庆", text: "<ruby>陈<rt>chén</rt></ruby><ruby>太<rt>tài</rt></ruby><ruby>丘<rt>qiū</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>友<rt>yǒu</rt></ruby><ruby>期<rt>qī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>期<rt>qī</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>中<rt>zhōng</rt></ruby>。<br><ruby>过<rt>guò</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<ruby>太<rt>tài</rt></ruby><ruby>丘<rt>qiū</rt></ruby><ruby>舍<rt>shě</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>去<rt>qù</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>乃<rt>nǎi</rt></ruby><ruby>至<rt>zhì</rt></ruby>。<br><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>七<rt>qī</rt></ruby><ruby>岁<rt>suì</rt></ruby>，<ruby>门<rt>mén</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>戏<rt>xì</rt></ruby>。<br><ruby>客<rt>kè</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby>：<ruby>尊<rt>zūn</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>不<rt>fǒu</rt></ruby>？<br><ruby>答<rt>dá</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>待<rt>dài</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>久<rt>jiǔ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<ruby>已<rt>yǐ</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>友<rt>yǒu</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>便<rt>biàn</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>非<rt>fēi</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>哉<rt>zāi</rt></ruby>！<ruby>与<rt>yǔ</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>期<rt>qī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>相<rt>xiāng</rt></ruby><ruby>委<rt>wěi</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>君<rt>jūn</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>期<rt>qī</rt></ruby><ru         { grade: "七年级下册", type: "文言文", title: "卖油翁", author: "欧阳修", text: "<ruby>陈<rt>chén</rt></ruby><ruby>康<rt>kāng</rt></ruby><ruby>肃<rt>sù</rt></ruby><ruby>公<rt>gōng</rt></ruby><ruby>善<rt>shàn</rt></ruby><ruby>射<rt>shè</rt></ruby>，<ruby>当<rt>dāng</rt></ruby><ruby>世<rt>shì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>双<rt>shuāng</rt></ruby>，<ruby>公<rt>gōng</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>此<rt>cǐ</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>矜<rt>jīn</rt></ruby>。<br><ruby>尝<rt>cháng</rt></ruby><ruby>射<rt>shè</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>圃<rt>pǔ</rt></ruby>，<ruby>有<rt>yǒu</rt></ruby><ruby>卖<rt>mài</rt></ruby><ruby>油<rt>yóu</rt></ruby><ruby>翁<rt>wēng</rt></ruby><ruby>释<rt>shì</rt></ruby><ruby>担<rt>dàn</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>立<rt>lì</rt></ruby>，<ruby>睨<rt>nì</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>久<rt>jiǔ</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>见<rt>jiàn</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>发<rt>fā</rt></ruby><ruby>矢<rt>shǐ</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>中<rt>zhòng</rt></ruby><ruby>八<rt>bā</rt></ruby><ruby>九<rt>jiǔ</rt></ruby>，<ruby>但<rt>dàn</rt></ruby><ruby>微<rt>wēi</rt></ruby><ruby>颔<rt>hàn</rt></ruby><ruby>之<rt>zhī</rt></ruby>。<br><ruby>康<rt>kāng</rt></ruby><ruby>肃<rt>sù</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>汝<rt>rǔ</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>射<rt>shè</rt></ruby><ruby>乎<rt>hū</rt></ruby>？<ruby>吾<rt>wú</rt></ruby><ruby>射<rt>shè</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>精<rt>jīng</rt></ruby><ruby>乎<rt>hū</rt></ruby>？<br><ruby>翁<rt>wēng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>无<rt>wú</rt></ruby><ruby>他<rt>tā</rt></ruby>，<ruby>但<rt>dàn</rt></ruby><ruby>手<rt>shǒu</rt></ruby><ruby>熟<rt>shú</rt></ruby><ruby>尔<rt>ěr</rt></ruby>。<br><ruby>康<rt>kāng</rt></ruby><ruby>肃<rt>sù</rt></ruby><ruby>忿<rt>fèn</rt></ruby><ruby>然<rt>rán</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>尔<rt>ěr</rt></ruby><ruby>安<rt>ān</rt></ruby><ruby>敢<rt>gǎn</rt></ruby><ruby>轻<rt>qīng</rt></ruby><ruby>吾<rt>wú</rt></ruby><ruby>射<rt>shè</rt></ruby>！<br><ruby>翁<rt>wēng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>以<rt>yǐ</rt></ruby><ruby>我<rt>wǒ</rt></ruby><ruby>酌<rt>zhuó</rt></ruby><ruby>油<rt>yóu</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>之<rt>zhī</rt></ruby>。<br><ruby>乃<rt>nǎi</rt></ruby><ruby>取<rt>qǔ</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>葫<rt>hú</rt></ruby><ruby>芦<rt>lú</rt></ruby><ruby>置<rt>zhì</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>地<rt>dì</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>钱<rt>qián</rt></ruby><ruby>覆<rt>fù</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>口<rt>kǒu</rt></ruby>，<ruby>徐<rt>xú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>杓<rt>sháo</rt></ruby><ruby>酌<rt>zhuó</rt></ruby><ruby>油<rt>yóu</rt></ruby><ruby>沥<rt>lì</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>自<rt>zì</rt></ruby><ruby>钱<rt>qián</rt></ruby><ruby>孔<rt>kǒng</rt></ruby><ruby>入<rt>rù</rt></ruby>，<ruby>而<rt>ér</rt></ruby><ruby>钱<rt>qián</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>湿<rt>shī</rt></ruby>。<br><ruby>因<rt>yīn</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>我<rt>wǒ</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>他<rt>tā</rt></ruby>，<ruby>惟<rt>wéi</rt></ruby><ruby>手<rt>shǒu</rt></ruby><ruby>熟<rt>shú</rt></ruby><ruby>尔<rt>ěr</rt></ruby>。<br><ruby>康<rt>kāng</rt></ruby><ruby>肃<rt>sù</rt></ruby><ruby>笑<rt>xiào</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>遣<rt>qiǎn</rt></ruby><ruby>之<rt>zhī</rt></ruby>。", done: false },
        
        { grade: "七年级下册", type: "文言文", title: "陋室铭", author: "刘禹锡", text: "<ruby>山<rt>shān</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>高<rt>gāo</rt></ruby>，<ruby>有<rt>yǒu</rt></ruby><ruby>仙<rt>xiān</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>名<rt>míng</rt></ruby>。<ruby>水<rt>shuǐ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>深<rt>shēn</rt></ruby>，<ruby>有<rt>yǒu</rt></ruby><ruby>龙<rt>lóng</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>灵<rt>líng</rt></ruby>。<br><ruby>斯<rt>sī</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>陋<rt>lòu</rt></ruby><ruby>室<rt>shì</rt></ruby>，<ruby>惟<rt>wéi</rt></ruby><ruby>吾<rt>wú</rt></ruby><ruby>德<rt>dé</rt></ruby><ruby>馨<rt>xīn</rt></ruby>。<br><ruby>苔<rt>tái</rt></ruby><ruby>痕<rt>hén</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>阶<rt>jiē</rt></ruby><ruby>绿<rt>lǜ</rt></ruby>，<ruby>草<rt>cǎo</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>帘<rt>lián</rt></ruby><ruby>青<rt>qīng</rt></ruby>。<br><ruby>谈<rt>tán</rt></ruby><ruby>笑<rt>xiào</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>鸿<rt>hóng</rt></ruby><ruby>儒<rt>rú</rt></ruby>，<ruby>往<rt>wǎng</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>丁<rt>dīng</rt></ruby>。<br><ruby>可<rt>kě</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>调<rt>tiáo</rt></ruby><ruby>素<rt>sù</rt></ruby><ruby>琴<rt>qín</rt></ruby>，<ruby>阅<rt>yuè</rt></ruby><ruby>金<rt>jīn</rt></ruby><ruby>经<rt>jīng</rt></ruby>。<br><ruby>无<rt>wú</rt></ruby><ruby>丝<rt>sī</rt></ruby><ruby>竹<rt>zhú</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>乱<rt>luàn</rt></ruby><ruby>耳<rt>ěr</rt></ruby>，<ruby>无<rt>wú</rt></ruby><ruby>案<rt>àn</rt></ruby><ruby>牍<rt>dú</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>劳<rt>láo</rt></ruby><ruby>形<rt>xíng</rt></ruby>。<br><ruby>南<rt>nán</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>诸<rt>zhū</rt></ruby><ruby>葛<rt>gě</rt></ruby><ruby>庐<rt>lú</rt></ruby>，<ruby>西<rt>xī</rt></ruby><ruby>蜀<rt>shǔ</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>亭<rt>tíng</rt></ruby>。<br><ruby>孔<rt>kǒng</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>云<rt>yún</rt></ruby>：<ruby>何<rt>hé</rt></ruby><ruby>陋<rt>lòu</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>有<rt>yǒu</rt></ruby>？", done: false },
        
        { grade: "七年级下册", type: "文言文", title: "爱莲说", author: "周敦颐", text: "<ruby>水<rt>shuǐ</rt></ruby><ruby>陆<rt>lù</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>木<rt>mù</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>花<rt>huā</rt></ruby>，<ruby>可<rt>kě</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>蕃<rt>fán</rt></ruby>。<br><ruby>晋<rt>jìn</rt></ruby><ruby>陶<rt>táo</rt></ruby><ruby>渊<rt>yuān</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>独<rt>dú</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>菊<rt>jú</rt></ruby>。<br><ruby>自<rt>zì</rt></ruby><ruby>李<rt>lǐ</rt></ruby><ruby>唐<rt>táng</rt></ruby><ruby>来<rt>lái</rt></ruby>，<ruby>世<rt>shì</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>牡<rt>mǔ</rt></ruby><ruby>丹<rt>dān</rt></ruby>。<br><ruby>予<rt>yú</rt></ruby><ruby>独<rt>dú</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>淤<rt>yū</rt></ruby><ruby>泥<rt>ní</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>染<rt>rǎn</rt></ruby>，<ruby>濯<rt>zhuó</rt></ruby><ruby>清<rt>qīng</rt></ruby><ruby>涟<rt>lián</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>妖<rt>yāo</rt></ruby>，<ruby>中<rt>zhōng</rt></ruby><ruby>通<rt>tōng</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>直<rt>zhí</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>蔓<rt>màn</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>枝<rt>zhī</rt></ruby>，<ruby>香<rt>xiāng</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>益<rt>yì</rt></ruby><ruby>清<rt>qīng</rt></ruby>，<ruby>亭<rt>tíng</rt></ruby><ruby>亭<rt>tíng</rt></ruby><ruby>净<rt>jìng</rt></ruby><ruby>植<rt>zhí</rt></ruby>，<ruby>可<rt>kě</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>观<rt>guān</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>亵<rt>xiè</rt></ruby><ruby>玩<rt>wán</rt></ruby><ruby>焉<rt>yān</rt></ruby>。<br><ruby>予<rt>yú</rt></ruby><ruby>谓<rt>wèi</rt></ruby><ruby>菊<rt>jú</rt></ruby>，<ruby>花<rt>huā</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>隐<rt>yǐn</rt></ruby><ruby>逸<rt>yì</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>也<rt>yě</rt></ruby>；<ruby>牡<rt>mǔ</rt></ruby><ruby>丹<rt>dān</rt></ruby>，<ruby>花<rt>huā</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>富<rt>fù</rt></ruby><ruby>贵<rt>guì</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>也<rt>yě</rt></ruby>；<ruby>莲<rt>lián</rt></ruby>，<ruby>花<rt>huā</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>噫<rt>yī</rt></ruby>！<ruby>菊<rt>jú</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>爱<rt>ài</rt></ruby>，<ruby>陶<rt>táo</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>鲜<rt>xiǎn</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>闻<rt>wén</rt></ruby>。<ruby>莲<rt>lián</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>爱<rt>ài</rt></ruby>，<ruby>同<rt>tóng</rt></ruby><ruby>予<rt>yú</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>人<rt>rén</rt></ruby>？<ruby>牡<rt>mǔ</rt></ruby><ruby>丹<rt>dān</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>爱<rt>ài</rt></ruby>，<ruby>宜<rt>yí</rt></ruby><ruby>乎<rt>hū</rt></ruby><ruby>众<rt>zhòng</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>。", done: false },            // 八年级上册

        { grade: "八年级上册", type: "古诗", title: "野望", author: "王绩", text: "<ruby>东<rt>dōng</rt></ruby><ruby>皋<rt>gāo</rt></ruby><ruby>薄<rt>bó</rt></ruby><ruby>暮<rt>mù</rt></ruby><ruby>望<rt>wàng</rt></ruby>，<ruby>徙<rt>xǐ</rt></ruby><ruby>倚<rt>yǐ</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>依<rt>yī</rt></ruby>。<br><ruby>树<rt>shù</rt></ruby><ruby>树<rt>shù</rt></ruby><ruby>皆<rt>jiē</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>色<rt>sè</rt></ruby>，<ruby>山<rt>shān</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>唯<rt>wéi</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>晖<rt>huī</rt></ruby>。<br><ruby>牧<rt>mù</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>驱<rt>qū</rt></ruby><ruby>犊<rt>dú</rt></ruby><ruby>返<rt>fǎn</rt></ruby>，<ruby>猎<rt>liè</rt></ruby><ruby>马<rt>mǎ</rt></ruby><ruby>带<rt>dài</rt></ruby><ruby>禽<rt>qín</rt></ruby><ruby>归<rt>guī</rt></ruby>。<br><ruby>相<rt>xiāng</rt></ruby><ruby>顾<rt>gù</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>识<rt>shí</rt></ruby>，<ruby>长<rt>cháng</rt></ruby><ruby>歌<rt>gē</rt></ruby><ruby>怀<rt>huái</rt></ruby><ruby>采<rt>cǎi</rt></ruby><ruby>薇<rt>wēi</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "黄鹤楼", author: "崔颢", text: "<ruby>昔<rt>xī</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>已<rt>yǐ</rt></ruby><ruby>乘<rt>chéng</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹤<rt>hè</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>此<rt>cǐ</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>余<rt>yú</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹤<rt>hè</rt></ruby><ruby>楼<rt>lóu</rt></ruby>。<br><ruby>黄<rt>huáng</rt></ruby><ruby>鹤<rt>hè</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>去<rt>qù</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>复<rt>fù</rt></ruby><ruby>返<rt>fǎn</rt></ruby>，<ruby>白<rt>bái</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>载<rt>zǎi</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>悠<rt>yōu</rt></ruby><ruby>悠<rt>yōu</rt></ruby>。<br><ruby>晴<rt>qíng</rt></ruby><ruby>川<rt>chuān</rt></ruby><ruby>历<rt>lì</rt></ruby><ruby>历<rt>lì</rt></ruby><ruby>汉<rt>hàn</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>树<rt>shù</rt></ruby>，<ruby>芳<rt>fāng</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>萋<rt>qī</rt></ruby><ruby>萋<rt>qī</rt></ruby><ruby>鹦<rt>yīng</rt></ruby><ruby>鹉<rt>wǔ</rt></ruby><ruby>洲<rt>zhōu</rt></ruby>。<br><ruby>日<rt>rì</rt></ruby><ruby>暮<rt>mù</rt></ruby><ruby>乡<rt>xiāng</rt></ruby><ruby>关<rt>guān</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>是<rt>shì</rt></ruby>？<ruby>烟<rt>yān</rt></ruby><ruby>波<rt>bō</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>使<rt>shǐ</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>愁<rt>chóu</rt></ruby>。", done: false },

        { grade: "八年级上册", type: "古诗", title: "赠从弟（其二）", author: "刘桢", text: "<ruby>亭<rt>tíng</rt></ruby><ruby>亭<rt>tíng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>松<rt>sōng</rt></ruby>，<ruby>瑟<rt>sè</rt></ruby><ruby>瑟<rt>sè</rt></ruby><ruby>谷<rt>gǔ</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>风<rt>fēng</rt></ruby>。<br><ruby>风<rt>fēng</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>盛<rt>shèng</rt></ruby>，<ruby>松<rt>sōng</rt></ruby><ruby>枝<rt>zhī</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>劲<rt>jìng</rt></ruby>！<br><ruby>冰<rt>bīng</rt></ruby><ruby>霜<rt>shuāng</rt></ruby><ruby>正<rt>zhèng</rt></ruby><ruby>惨<rt>cǎn</rt></ruby><ruby>凄<rt>qī</rt></ruby>，<ruby>终<rt>zhōng</rt></ruby><ruby>岁<rt>suì</rt></ruby><ruby>常<rt>cháng</rt></ruby><ruby>端<rt>duān</rt></ruby><ruby>正<rt>zhèng</rt></ruby>。<br><ruby>岂<rt>qǐ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>罹<rt>lí</rt></ruby><ruby>凝<rt>níng</rt></ruby><ruby>寒<rt>hán</rt></ruby>？<ruby>松<rt>sōng</rt></ruby><ruby>柏<rt>bǎi</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>本<rt>běn</rt></ruby><ruby>性<rt>xìng</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "梁甫行", author: "曹植", text: "<ruby>八<rt>bā</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>各<rt>gè</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>气<rt>qì</rt></ruby>，<ruby>千<rt>qiān</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>殊<rt>shū</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>雨<rt>yǔ</rt></ruby>。<br><ruby>剧<rt>jù</rt></ruby><ruby>哉<rt>zāi</rt></ruby><ruby>边<rt>biān</rt></ruby><ruby>海<rt>hǎi</rt></ruby><ruby>民<rt>mín</rt></ruby>，<ruby>寄<rt>jì</rt></ruby><ruby>身<rt>shēn</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>野<rt>yě</rt></ruby>。<br><ruby>妻<rt>qī</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>象<rt>xiàng</rt></ruby><ruby>禽<rt>qín</rt></ruby><ruby>兽<rt>shòu</rt></ruby>，<ruby>行<rt>xíng</rt></ruby><ruby>止<rt>zhǐ</rt></ruby><ruby>依<rt>yī</rt></ruby><ruby>林<rt>lín</rt></ruby><ruby>阻<rt>zǔ</rt></ruby>。<br><ruby>柴<rt>chái</rt></ruby><ruby>门<rt>mén</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>萧<rt>xiāo</rt></ruby><ruby>条<rt>tiáo</rt></ruby>，<ruby>狐<rt>hú</rt></ruby><ruby>兔<rt>tù</rt></ruby><ruby>翔<rt>xiáng</rt></ruby><ruby>我<rt>wǒ</rt></ruby><ruby>宇<rt>yǔ</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "浣溪沙·一曲新词酒一杯", author: "晏殊", text: "<ruby>一<rt>yī</rt></ruby><ruby>曲<rt>qǔ</rt></ruby><ruby>新<rt>xīn</rt></ruby><ruby>词<rt>cí</rt></ruby><ruby>酒<rt>jiǔ</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>杯<rt>bēi</rt></ruby>，<ruby>去<rt>qù</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>气<rt>qì</rt></ruby><ruby>旧<rt>jiù</rt></ruby><ruby>亭<rt>tíng</rt></ruby><ruby>台<rt>tái</rt></ruby>。<ruby>夕<rt>xī</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>回<rt>huí</rt></ruby>？<br><ruby>无<rt>wú</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>奈<rt>nài</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>似<rt>sì</rt></ruby><ruby>曾<rt>céng</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>燕<rt>yàn</rt></ruby><ruby>归<rt>guī</rt></ruby><ruby>来<rt>lái</rt></ruby>。<ruby>小<rt>xiǎo</rt></ruby><ruby>园<rt>yuán</rt></ruby><ruby>香<rt>xiāng</rt></ruby><ruby>径<rt>jìng</rt></ruby><ruby>独<rt>dú</rt></ruby><ruby>徘<rt>pái</rt></ruby><ruby>徊<rt>huái</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "采桑子·轻舟短棹西湖好", author: "欧阳修", text: "<ruby>轻<rt>qīng</rt></ruby><ruby>舟<rt>zhōu</rt></ruby><ruby>短<rt>duǎn</rt></ruby><ruby>棹<rt>zhào</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>湖<rt>hú</rt></ruby><ruby>好<rt>hǎo</rt></ruby>，<ruby>绿<rt>lǜ</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>逶<rt>wēi</rt></ruby><ruby>迤<rt>yí</rt></ruby>，<ruby>芳<rt>fāng</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>长<rt>cháng</rt></ruby><ruby>堤<rt>dī</rt></ruby>，<ruby>隐<rt>yǐn</rt></ruby><ruby>隐<rt>yǐn</rt></ruby><ruby>笙<rt>shēng</rt></ruby><ruby>歌<rt>gē</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>随<rt>suí</rt></ruby>。<br><ruby>无<rt>wú</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>面<rt>miàn</rt></ruby><ruby>琉<rt>liú</rt></ruby><ruby>璃<rt>lí</rt></ruby><ruby>滑<rt>huá</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>觉<rt>jué</rt></ruby><ruby>船<rt>chuán</rt></ruby><ruby>移<rt>yí</rt></ruby>，<ruby>微<rt>wēi</rt></ruby><ruby>动<rt>dòng</rt></ruby><ruby>涟<rt>lián</rt></ruby><ruby>漪<rt>yī</rt></ruby>，<ruby>惊<rt>jīng</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>沙<rt>shā</rt></ruby><ruby>禽<rt>qín</rt></ruby><ruby>掠<rt>lüè</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>飞<rt>fēi</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "相见欢·金陵城上西楼", author: "朱敦儒", text: "<ruby>金<rt>jīn</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>城<rt>chéng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>楼<rt>lóu</rt></ruby>，<ruby>倚<rt>yǐ</rt></ruby><ruby>清<rt>qīng</rt></ruby><ruby>秋<rt>qiū</rt></ruby>。<ruby>万<rt>wàn</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>夕<rt>xī</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>垂<rt>chuí</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>流<rt>liú</rt></ruby>。<br><ruby>中<rt>zhōng</rt></ruby><ruby>原<rt>yuán</rt></ruby><ruby>乱<rt>luàn</rt></ruby>，<ruby>簪<rt>zān</rt></ruby><ruby>缨<rt>yīng</rt></ruby><ruby>散<rt>sàn</rt></ruby>，<ruby>几<rt>jǐ</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>收<rt>shōu</rt></ruby>？<ruby>试<rt>shì</rt></ruby><ruby>倩<rt>qiàn</rt></ruby><ruby>悲<rt>bēi</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>吹<rt>chuī</rt></ruby><ruby>泪<rt>lèi</rt></ruby><ruby>过<rt>guò</rt></ruby><ruby>扬<rt>yáng</rt></ruby><ruby>州<rt>zhōu</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "古诗", title: "如梦令·常记溪亭日暮", author: "李清照", text: "<ruby>常<rt>cháng</rt></ruby><ruby>记<rt>jì</rt></ruby><ruby>溪<rt>xī</rt></ruby><ruby>亭<rt>tíng</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>暮<rt>mù</rt></ruby>，<ruby>沉<rt>chén</rt></ruby><ruby>醉<rt>zuì</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>归<rt>guī</rt></ruby><ruby>路<rt>lù</rt></ruby>。<br><ruby>兴<rt>xìng</rt></ruby><ruby>尽<rt>jìn</rt></ruby><ruby>晚<rt>wǎn</rt></ruby><ruby>回<rt>huí</rt></ruby><ruby>舟<rt>zhōu</rt></ruby>，<ruby>误<rt>wù</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>藕<rt>ǒu</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>处<rt>chù</rt></ruby>。<br><ruby>争<rt>zhēng</rt></ruby><ruby>渡<rt>dù</rt></ruby>，<ruby>争<rt>zhēng</rt></ruby><ruby>渡<rt>dù</rt></ruby>，<ruby>惊<rt>jīng</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>滩<rt>tān</rt></ruby><ruby>鸥<rt>ōu</rt></ruby><ruby>鹭<rt>lù</rt></ruby>。", done: false },
        
        { grade: "八年级上册", type: "文言文", title: "三峡", author: "郦道元", text: "<ruby>自<rt>zì</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>峡<rt>xiá</rt></ruby><ruby>七<rt>qī</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<ruby>两<rt>liǎng</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>连<rt>lián</rt></ruby><ruby>山<rt>shān</rt></ruby>，<ruby>略<rt>lüè</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>阙<rt>quē</rt></ruby><ruby>处<rt>chù</rt></ruby>。<br><ruby>重<rt>chóng</rt></ruby><ruby>岩<rt>yán</rt></ruby><ruby>叠<rt>dié</rt></ruby><ruby>嶂<rt>zhàng</rt></ruby>，<ruby>隐<rt>yǐn</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>蔽<rt>bì</rt></ruby><ruby>日<rt>rì</rt></ruby>，<ruby>自<rt>zì</rt></ruby><ruby>非<rt>fēi</rt></ruby><ruby>亭<rt>tíng</rt></ruby><ruby>午<rt>wǔ</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>分<rt>fēn</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>曦<rt>xī</rt></ruby><ruby>月<rt>yuè</rt></ruby>。<br><ruby>至<rt>zhì</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>夏<rt>xià</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>襄<rt>xiāng</rt></ruby><ruby>陵<rt>líng</rt></ruby>，<ruby>沿<rt>yán</rt></ruby><ruby>溯<rt>sù</rt></ruby><ruby>阻<rt>zǔ</rt></ruby><ruby>绝<rt>jué</rt></ruby>。<br><ruby>或<rt>huò</rt></ruby><ruby>王<rt>wáng</rt></ruby><ruby>命<rt>mìng</rt></ruby><ruby>急<rt>jí</rt></ruby><ruby>宣<rt>xuān</rt></ruby>，<ruby>有<rt>yǒu</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>朝<rt>zhāo</rt></ruby><ruby>发<rt>fā</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>帝<rt>dì</rt></ruby>，<ruby>暮<rt>mù</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>陵<rt>líng</rt></ruby>，<ruby>其<rt>qí</rt></ruby><ruby>间<rt>jiān</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>里<rt>lǐ</rt></ruby>，<ruby>虽<rt>suī</rt></ruby><ruby>乘<rt>chéng</rt></ruby><ruby>奔<rt>bēn</rt></ruby><ruby>御<rt>yù</rt></ruby><ruby>风<rt>fēng</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>疾<rt>jí</rt></ruby><ruby>也<rt>yě</rt></ruby>         { grade: "八年级上册", type: "文言文", title: "记承天寺夜游", author: "苏轼", text: "<ruby>元<rt>yuán</rt></ruby><ruby>丰<rt>fēng</rt></ruby><ruby>六<rt>liù</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>夜<rt>yè</rt></ruby>，<ruby>解<rt>jiě</rt></ruby><ruby>衣<rt>yī</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>睡<rt>shuì</rt></ruby>，<ruby>月<rt>yuè</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>户<rt>hù</rt></ruby>，<ruby>欣<rt>xīn</rt></ruby><ruby>然<rt>rán</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>行<rt>xíng</rt></ruby>。<br><ruby>念<rt>niàn</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>为<rt>wéi</rt></ruby><ruby>乐<rt>lè</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>遂<rt>suì</rt></ruby><ruby>至<rt>zhì</rt></ruby><ruby>承<rt>chéng</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>寺<rt>sì</rt></ruby><ruby>寻<rt>xún</rt></ruby><ruby>张<rt>zhāng</rt></ruby><ruby>怀<rt>huái</rt></ruby><ruby>民<rt>mín</rt></ruby>。<br><ruby>怀<rt>huái</rt></ruby><ruby>民<rt>mín</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>寝<rt>qǐn</rt></ruby>，<ruby>相<rt>xiāng</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>步<rt>bù</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>庭<rt>tíng</rt></ruby>。<br><ruby>庭<rt>tíng</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>积<rt>jī</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>明<rt>míng</rt></ruby>，<ruby>水<rt>shuǐ</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>藻<rt>zǎo</rt></ruby>、<ruby>荇<rt>xìng</rt></ruby><ruby>交<rt>jiāo</rt></ruby><ruby>横<rt>héng</rt></ruby>，<ruby>盖<rt>gài</rt></ruby><ruby>竹<rt>zhú</rt></ruby><ruby>柏<rt>bǎi</rt></ruby><ruby>影<rt>yǐng</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>何<rt>hé</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>月<rt>yuè</rt></ruby>？<ruby>何<rt>hé</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>无<rt>wú</rt         { grade: "八年级上册", type: "文言文", title: "与朱元思书", author: "吴均", text: "<ruby>风<rt>fēng</rt></ruby><ruby>烟<rt>yān</rt></ruby><ruby>俱<rt>jù</rt></ruby><ruby>净<rt>jìng</rt></ruby>，<ruby>天<rt>tiān</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>共<rt>gòng</rt></ruby><ruby>色<rt>sè</rt></ruby>。<ruby>从<rt>cóng</rt></ruby><ruby>流<rt>liú</rt></ruby><ruby>飘<rt>piāo</rt></ruby><ruby>荡<rt>dàng</rt></ruby>，<ruby>任<rt>rèn</rt></ruby><ruby>意<rt>yì</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>西<rt>xī</rt></ruby>。<br><ruby>自<rt>zì</rt></ruby><ruby>富<rt>fù</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>至<rt>zhì</rt></ruby><ruby>桐<rt>tóng</rt></ruby><ruby>庐<rt>lú</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>许<rt>xǔ</rt></ruby><ruby>里<rt>lǐ</rt></ruby>，<ruby>奇<rt>qí</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>水<rt>shuǐ</rt></ruby>，<ruby>天<rt>tiān</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>独<rt>dú</rt></ruby><ruby>绝<rt>jué</rt></ruby>。<br><ruby>水<rt>shuǐ</rt></ruby><ruby>皆<rt>jiē</rt></ruby><ruby>缥<rt>piǎo</rt></ruby><ruby>碧<rt>bì</rt></ruby>，<ruby>千<rt>qiān</rt></ruby><ruby>丈<rt>zhàng</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>底<rt>dǐ</rt></ruby>。<ruby>游<rt>yóu</rt></ruby><ruby>鱼<rt>yú</rt></ruby><ruby>细<rt>xì</rt></ruby><ruby>石<rt>shí</rt></ruby>，<ruby>直<rt>zhí</rt></ruby><ruby>视<rt>shì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>碍<rt>ài</rt></ruby>。<br><ruby>急<rt>jí</rt></ruby><ruby>湍<rt>tuān</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>箭<rt>jiàn</rt></ruby>，<ruby>猛<rt>měng</rt></ruby><ruby>浪<rt>làng</rt></ruby><ruby>若<rt>ruò</rt></ruby><ruby>奔<rt>bēn</rt></ruby>。<br><ruby>夹<rt>jiā</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>高<rt>gāo</rt></ruby><ruby>山<rt>shān</rt></ruby>，<ruby>皆<rt>jiē</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>寒<rt>hán</rt></ruby><ruby>树<rt>shù</rt></ruby>，<ruby>负<rt>fù</rt></ruby><ruby>势<rt>shì</rt></ruby><ruby>竞<rt>jìng</rt></ruby><ruby>上<rt>shàng</rt></ruby>，<ruby>互<rt>hù</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>轩<rt         { grade: "八年级下册", type: "文言文", title: "桃花源记", author: "陶渊明", text: "<ruby>晋<rt>jìn</rt></ruby><ruby>太<rt>tài</rt></ruby><ruby>元<rt>yuán</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<ruby>武<rt>wǔ</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>捕<rt>bǔ</rt></ruby><ruby>鱼<rt>yú</rt></ruby><ruby>为<rt>wéi</rt></ruby><ruby>业<rt>yè</rt></ruby>。<br><ruby>缘<rt>yuán</rt></ruby><ruby>溪<rt>xī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>忘<rt>wàng</rt></ruby><ruby>路<rt>lù</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>近<rt>jìn</rt></ruby>。<br><ruby>忽<rt>hū</rt></ruby><ruby>逢<rt>féng</rt></ruby><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>林<rt>lín</rt></ruby>，<ruby>夹<rt>jiā</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>数<rt>shù</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>步<rt>bù</rt></ruby>，<ruby>中<rt>zhōng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>杂<rt>zá</rt></ruby><ruby>树<rt>shù</rt></ruby>，<ruby>芳<rt>fāng</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>鲜<rt>xiān</rt></ruby><ruby>美<rt>měi</rt></ruby>，<ruby>落<rt>luò</rt></ruby><ruby>英<rt>yīng</rt></ruby><ruby>缤<rt>bīn</rt></ruby><ruby>纷<rt>fēn</rt></ruby>。<br><ruby>渔<rt>yú</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>复<rt>fù</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>欲<rt>yù</rt></ruby><ruby>穷<rt>qióng</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>林<rt>lín</rt></ruby>。<br><ruby>林<rt>lín</rt></ruby><ruby>尽<rt>jìn</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>源<rt>yuán</rt></ruby>，<ruby>便<rt>biàn</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>山<rt>shān</rt></ruby>，<ruby>山<rt>shān</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>小<rt>xiǎo</rt></ruby><ruby>口<rt>kǒu</rt></ruby>，<ruby>仿<rt>fǎng</rt></ruby><ruby>佛<rt>fú</rt></ruby><ruby>若<rt>ruò</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>光<rt>guāng</rt></ruby>。<br><ruby>便<rt>biàn</rt></ruby><ruby>舍<rt>shě</rt></ruby><ruby>         { grade: "九年级上册", type: "古诗", title: "无题", author: "李商隐", text: "<ruby>相<rt>xiāng</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>难<rt>nán</rt></ruby><ruby>别<rt>bié</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>难<rt>nán</rt></ruby>，<ruby>东<rt>dōng</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>力<rt>lì</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>残<rt>cán</rt></ruby>。<br><ruby>春<rt>chūn</rt></ruby><ruby>蚕<rt>cán</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>死<rt>sǐ</rt></ruby><ruby>丝<rt>sī</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>尽<rt>jìn</rt></ruby>，<ruby>蜡<rt>là</rt></ruby><ruby>炬<rt>jù</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>灰<rt>huī</rt></ruby><ruby>泪<rt>lèi</rt></ruby><ruby>始<rt>shǐ</rt></ruby><ruby>干<rt>gān</rt></ruby>。<br><ruby>晓<rt>xiǎo</rt></ruby><ruby>镜<rt>jìng</rt></ruby><ruby>但<rt>dàn</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>鬓<rt>bìn</rt></ruby><ruby>改<rt>gǎi</rt></ruby>，<ruby>夜<rt>yè</rt></ruby><ruby>吟<rt>yín</rt></ruby><ruby>应<rt>yīng</rt></ruby><ruby>觉<rt>jué</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>寒<rt>hán</rt></ruby>。<br><ruby>蓬<rt>péng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>此<rt>cǐ</rt></ruby><ruby>去<rt>qù</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>多<rt>duō</rt></ruby><ruby>路<rt>lù</rt></ruby>，<ruby>青<rt>qīng</rt></ruby><ruby>鸟<rt>niǎo</rt></ruby><ruby>殷<rt>yīn</rt></ruby><ruby>勤<rt>qín</rt></ruby><ruby>为<rt>wèi</rt></ruby><ruby>探<rt>tàn</rt></ruby><ruby>看<rt>kān</rt></ruby>。", done: false },
        
        { grade: "九年级上册", type: "古诗", title: "行香子·树绕村庄", author: "秦观", text: "<ruby>树<rt>shù</rt></ruby><ruby>绕<rt>rào</rt></ruby><ruby>村<rt>cūn</rt></ruby><ruby>庄<rt>zhuāng</rt></ruby>，<ruby>水<rt>shuǐ</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>陂<rt>bēi</rt></ruby><ruby>塘<rt>táng</rt></ruby>。<br><ruby>倚<rt>yǐ</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>风<rt>fēng</rt></ruby>，<ruby>豪<rt>háo</rt></ruby><ruby>兴<rt>xìng</rt></ruby><ruby>徜<rt>cháng</rt></ruby><ruby>徉<rt>yáng</rt></ruby>。<br><ruby>小<rt>xiǎo</rt></ruby><ruby>园<rt>yuán</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>许<rt>xǔ</rt></ruby>，<ruby>收<rt>shōu</rt></ruby><ruby>尽<rt>jìn</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>光<rt>guāng</rt></ruby>。<br><ruby>有<rt>yǒu</rt></ruby><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>红<rt>hóng</rt></ruby>，<ruby>李<rt>lǐ</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>白<rt>bái</rt></ruby>，<ruby>菜<rt>cài</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>黄<rt>huáng</rt></ruby>。<br><ruby>远<rt>yuǎn</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>围<rt>wéi</rt></ruby><ruby>墙<rt>qiáng</rt></ruby>，<ruby>隐<rt>yǐn</rt></ruby><ruby>隐<rt>yǐn</rt></ruby><ruby>茅<rt>máo</rt></ruby><ruby>堂<rt>táng</rt></ruby>。<br><ruby>飏<rt>yáng</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>旗<rt>qí</rt></ruby>，<ruby>流<rt>liú</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>桥<rt>qiáo</rt></ruby><ruby>旁<rt>páng</rt></ruby>。<br><ruby>偶<rt>ǒu</rt></ruby><ruby>然<rt>rán</rt></ruby><ruby>乘<rt>chéng</rt></ruby><ruby>兴<rt>xìng</rt></ruby>，<ruby>步<rt>bù</rt></ruby><ruby>过<rt>guò</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>冈<rt>gāng</rt></ruby>。<br><ruby>正<rt>zhèng</rt></ruby><ruby>莺<rt>yīng</rt></ruby><ruby>儿<rt>ér</rt></ruby><ruby>啼<rt>tí</rt></ruby>，<ruby>燕<rt>yàn</rt></ruby><ruby>儿<rt>ér</rt></ruby><ruby>舞<rt>wǔ</rt></ruby>，<ruby>蝶<rt>dié</rt></ruby><ruby>儿<rt>ér</rt></ruby><ruby>忙<rt>máng</rt></ruby>。", done: false },
        
        { grade: "九年级上册", type: "古诗", title: "丑奴儿·书博山道中壁", author: "辛弃疾", text: "<ruby>少<rt>shào</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>滋<rt>zī</rt></ruby><ruby>味<rt>wèi</rt></ruby>，<ruby>爱<rt>ài</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>层<rt>céng</rt></ruby><ruby>楼<rt>lóu</rt></ruby>。<br><ruby>爱<rt>ài</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>层<rt>céng</rt></ruby><ruby>楼<rt>lóu</rt></ruby>，<ruby>为<rt>wèi</rt></ruby><ruby>赋<rt>fù</rt></ruby><ruby>新<rt>xīn</rt></ruby><ruby>词<rt>cí</rt></ruby><ruby>强<rt>qiǎng</rt></ruby><ruby>说<rt>shuō</rt></ruby><ruby>愁<rt>chóu</rt></ruby>。<br><ruby>而<rt>ér</rt></ruby><ruby>今<rt>jīn</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>尽<rt>jìn</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>滋<rt>zī</rt></ruby><ruby>味<rt>wèi</rt></ruby>，<ruby>欲<rt>yù</rt></ruby><ruby>说<rt>shuō</rt></ruby><ruby>还<rt>huán</rt></ruby><ruby>休<rt>xiū</rt></ruby>。<br><ruby>欲<rt>yù</rt></ruby><ruby>说<rt>shuō</rt></ruby><ruby>还<rt>huán</rt></ruby><ruby>休<rt>xiū</rt></ruby>，<ruby>却<rt>què</rt></ruby><ruby>道<rt>dào</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>凉<rt>liáng</rt></ruby><ruby>好<rt>hǎo</rt></ruby><ruby>个<rt>gè</rt></ruby><ruby>秋<rt>qiū</rt></ruby>。", done: false },
        
        { grade: "九年级上册", type: "文言文", title: "岳阳楼记", author: "范仲淹", text: "<ruby>庆<rt>qìng</rt></ruby><ruby>历<rt>lì</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>春<rt>chūn</rt></ruby>，<ruby>滕<rt>téng</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>京<rt>jīng</rt></ruby><ruby>谪<rt>zhé</rt></ruby><ruby>守<rt>shǒu</rt></ruby><ruby>巴<rt>bā</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>郡<rt>jùn</rt></ruby>。<br><ruby>越<rt>yuè</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>年<rt>nián</rt></ruby>，<ruby>政<rt>zhèng</rt></ruby><ruby>通<rt>tōng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>和<rt>hé</rt></ruby>，<ruby>百<rt>bǎi</rt></ruby><ruby>废<rt>fèi</rt></ruby><ruby>具<rt>jù</rt></ruby><ruby>兴<rt>xīng</rt></ruby>。<br><ruby>乃<rt>nǎi</rt></ruby><ruby>重<rt>chóng</rt></ruby><ruby>修<rt>xiū</rt></ruby><ruby>岳<rt>yuè</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>楼<rt>lóu</rt></ruby>，<ruby>增<rt>zēng</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>旧<rt>jiù</rt></ruby><ruby>制<rt>zhì</rt></ruby>，<ruby>刻<rt>kè</rt></ruby><ruby>唐<rt>táng</rt></ruby><ruby>贤<rt>xián</rt></ruby><ruby>今<rt>jīn</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>诗<rt>shī</rt></ruby><ruby>赋<rt>fù</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>上<rt>shàng</rt></ruby>。<br><ruby>属<rt>zhǔ</rt></ruby><ruby>予<rt>yú</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>文<rt>wén</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>记<rt>jì</rt></ruby><ruby>之<rt>zhī</rt></ruby>。<br><ruby>予<rt>yú</rt></ruby><ruby>观<rt>guān</rt></ruby><ruby>夫<rt>fú</rt></ruby><ruby>巴<rt>bā</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>胜<rt>shèng</rt></ruby><ruby>状<rt>zhuàng</rt></ruby>，<ruby>在<rt>zài</rt></ruby><ruby>洞<rt>dòng</rt></ruby><ruby>庭<rt>tíng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>湖<rt>hú</rt></ruby>。<br><ruby>衔<rt>xián</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>山<rt>shān</rt></ruby>，<ruby>吞<rt>tūn</rt></ruby><ruby>长<rt>cháng</rt></ruby><ruby>江<rt>jiāng</rt></ruby>，<ruby>浩<rt>hào</rt></ruby><ruby>浩<rt>hào</rt></ruby><ruby>汤<rt>shāng</rt></ruby><ruby>汤<rt>shāng</rt></ruby>，<ruby>横<rt>héng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>际<rt>jì</rt></ruby><ruby>涯<rt>yá</rt></ruby>；<ruby>朝<rt>zhāo</rt></ruby><ruby>晖<rt>huī</rt></ruby><ruby>夕<rt>xī</rt></ruby><ruby>阴<rt>yīn</rt></ruby>，<ruby>气<rt>qì</rt></ruby><ruby>象<rt>xiàng</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>千<rt>qiān</rt></ruby>。<br><ruby>此<rt>cǐ</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>岳<rt>yuè</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>楼<rt>lóu</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>观<rt>guān</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>前<rt>qián</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>述<rt>shù</rt></ruby><ruby>备<rt>bèi</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>。<br><ruby>然<rt>rán</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>北<rt>běi</rt></ruby><ruby>通<rt>tōng</rt></ruby><ruby>巫<rt>wū</rt></ruby><ruby>峡<rt>xiá</rt></ruby>，<ruby>南<rt>nán</rt></ruby><ruby>极<rt>jí</rt></ruby><ruby>潇<rt>xiāo</rt></ruby><ruby>湘<rt>xiāng</rt></ruby>，<ruby>迁<rt>qiān</rt></ruby><ruby>客<rt>kè</rt></ruby><ruby>骚<rt>sāo</rt></ruby><ruby>人<rt>rén</rt></ruby>，<ruby>多<rt>duō</rt></ruby><ruby>会<rt>huì</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>此<rt>cǐ</rt></ruby>，<ruby>览<rt>lǎn</rt></ruby><ruby>物<rt>wù</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>情<rt>qíng</rt></ruby>，<ruby>得<rt>dé</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>乎<rt>hū</rt></ruby>？<br><ruby>若<rt>ruò</rt></ruby><ruby>夫<rt>fú</rt></ruby><ruby>淫<rt>yín</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>霏<rt>fēi</rt></ruby><ruby>霏<rt>fēi</rt></ruby>，<ruby>连<rt>lián</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>开<rt>kāi</rt></ruby>，<ruby>阴<rt>yīn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>号<rt>háo</rt></ruby>，<ruby>浊<rt>zhuó</rt></ruby><ruby>浪<rt>làng</rt></ruby><ruby>排<rt>pái</rt></ruby><ruby>空<rt>kōng</rt></ruby>；<ruby>日<rt>rì</rt></ruby><ruby>星<rt>xīng</rt></ruby><ruby>隐<rt>yǐn</rt></ruby><ruby>曜<rt>yào</rt></ruby         { grade: "九年级下册", type: "古诗", title: "十五从军征", author: "《乐府诗集》", text: "<ruby>十<rt>shí</rt></ruby><ruby>五<rt>wǔ</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>军<rt>jūn</rt></ruby><ruby>征<rt>zhēng</rt></ruby>，<ruby>八<rt>bā</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>始<rt>shǐ</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>归<rt>guī</rt></ruby>。<br><ruby>道<rt>dào</rt></ruby><ruby>逢<rt>féng</rt></ruby><ruby>乡<rt>xiāng</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>人<rt>rén</rt></ruby>：<ruby>家<rt>jiā</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>阿<rt>ā</rt></ruby><ruby>谁<rt>shuí</rt></ruby>？<br><ruby>遥<rt>yáo</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>家<rt>jiā</rt></ruby>，<ruby>松<rt>sōng</rt></ruby><ruby>柏<rt>bǎi</rt></ruby><ruby>冢<rt>zhǒng</rt></ruby><ruby>累<rt>lěi</rt></ruby><ruby>累<rt>lěi</rt></ruby>。<br><ruby>兔<rt>tù</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>狗<rt>gǒu</rt></ruby><ruby>窦<rt>dòu</rt></ruby><ruby>入<rt>rù</rt></ruby>，<ruby>雉<rt>zhì</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>梁<rt>liáng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>飞<rt>fēi</rt></ruby>。<br><ruby>中<rt>zhōng</rt></ruby><ruby>庭<rt>tíng</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>旅<rt>lǚ</rt></ruby><ruby>谷<rt>gǔ</rt></ruby>，<ruby>井<rt>jǐng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>旅<rt>lǚ</rt></ruby><ruby>葵<rt>kuí</rt></ruby>。<br><ruby>舂<rt>chōng</rt></ruby><ruby>谷<rt>gǔ</rt></ruby><ruby>持<rt>chí</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>饭<rt>fàn</rt></ruby>，<ruby>采<rt>cǎi</rt></ruby><ruby>葵<rt>kuí</rt></ruby><ruby>持<rt>chí</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>羹<rt>gēng</rt></ruby>。<br><ruby>羹<rt>gēng</rt></ruby><ruby>饭<rt>fàn</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>熟<rt>shú</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>饴<rt>yí</rt></ruby><ruby>阿<rt>ā</rt></ruby><ruby>谁<rt>shuí</rt></ruby>。<br><ruby>出<rt>chū</rt></ruby><ruby>门<rt>mén</r         { grade: "九年级下册", type: "文言文", title: "曹刿论战", author: "《左传》", text: "<ruby>十<rt>shí</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>春<rt>chūn</rt></ruby>，<ruby>齐<rt>qí</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>伐<rt>fá</rt></ruby><ruby>我<rt>wǒ</rt></ruby>。<br><ruby>公<rt>gōng</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>战<rt>zhàn</rt></ruby>，<ruby>曹<rt>cáo</rt></ruby><ruby>刿<rt>guì</rt></ruby><ruby>请<rt>qǐng</rt></ruby><ruby>见<rt>jiàn</rt></ruby>。<br><ruby>其<rt>qí</rt></ruby><ruby>乡<rt>xiāng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>肉<rt>ròu</rt></ruby><ruby>食<rt>shí</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>谋<rt>móu</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>又<rt>yòu</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>间<rt>jiàn</rt></ruby><ruby>焉<rt>yān</rt></ruby>？<br><ruby>刿<rt>guì</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>肉<rt>ròu</rt></ruby><ruby>食<rt>shí</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>鄙<rt>bǐ</rt></ruby>，<ruby>未<rt>wèi</rt></ruby><ruby>能<rt>néng</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>谋<rt>móu</rt></ruby>。<br><ruby>乃<rt>nǎi</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>见<rt>jiàn</rt></ruby>。<br><ruby>问<rt>wèn</rt></ruby>：<ruby>何<rt>hé</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>战<rt>zhàn</rt></ruby>？<br><ruby>公<rt>gōng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>衣<rt>yī</rt></ruby><ruby>食<rt>shí</rt></ruby><ruby>所<rt>suǒ</rt></ruby><ruby>安<rt>ān</rt></ruby>，<ruby>弗<rt>fú</rt></ruby><ruby>敢<rt>gǎn</rt></ruby><ruby>专<rt>zhuān</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>必<rt>bì</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>分<rt>fēn</rt></ruby><ruby>人<rt>rén</rt></ruby>。<br><ruby>对<rt>duì</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>小<rt>xiǎo</rt></ruby><ruby>惠<rt>huì</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>遍<rt>biàn</rt></ruby>，<ruby>民<rt>mín</rt></ruby><ruby>弗<rt>fú</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>公<rt>gōng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>牺<rt>xī</rt></ruby><ruby>牲<rt>shēng</rt 布<rt>bù</rt></ruby><ruby>衣<rt>yī</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>乎<rt>hū</rt></ruby>？<br><ruby>秦<rt>qín</rt></ruby><ruby>王<rt>wáng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>布<rt>bù</rt></ruby><ruby>衣<rt>yī</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>怒<rt>nù</rt></ruby>，<ruby>亦<rt>yì</rt></ruby><ruby>免<rt>miǎn</rt></ruby><ruby>冠<rt>guān</rt></ruby><ruby>徒<rt>tú</rt></ruby><ruby>跣<rt>xiǎn</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>抢<rt>qiāng</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>耳<rt>ěr</rt></ruby>。<br><ruby>唐<rt>táng</rt></ruby><ruby>雎<rt>jū</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>此<rt>cǐ</rt></ruby><ruby>庸<rt>yōng</rt></ruby><ruby>夫<rt>fū</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>非<rt>fēi</rt></ruby><ruby>士<rt>shì</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>夫<rt>fú</rt></ruby><ruby>专<rt>zhuān</rt></ruby><ruby>诸<rt>zhū</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>刺<rt>cì</rt></ruby><ruby>王<rt>wáng</rt></ruby><ruby>僚<rt>liáo</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>彗<rt>huì</rt></ruby><ruby>星<rt>xīng</rt></ruby><ruby>袭<rt>xí</rt></ruby><ruby>月<rt>yuè</rt></ruby>；<ruby>聂<rt>niè</rt></ruby><ruby>政<rt>zhèng</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>刺<rt>cì</rt></ruby><ruby>韩<rt>hán</rt></ruby><ruby>傀<rt>kuǐ</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>白<rt>bái</rt></ruby><ruby>虹<rt>hóng</rt></ruby><ruby>贯<rt>guàn</rt></ruby><ruby>日<rt>rì</rt></ruby>；<ruby>要<rt>yāo</rt></ruby><ruby>离<rt>lí</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>刺<rt>cì</rt></ruby><ruby>庆<rt>qìng</rt></ruby><ruby>忌<rt>jì</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>仓<rt>cāng</rt></ruby><ruby>鹰<rt>yīng</rt></ruby><ruby>击<rt>jī</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>殿<rt>diàn</rt></ruby><ruby>上<rt>shàng</rt></ruby>。<br><ruby>此<rt>cǐ</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>皆<rt>jiē</rt></ruby><ruby>布<rt>bù</rt></ruby><ruby>衣<rt>yī</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>士<rt>shì</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>怀<rt>huái</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>发<rt>fā</rt></ruby>，<ruby>休<rt>xiū</rt></ruby><ruby>祲<rt>jìn</rt></ruby><ruby>降<rt>jiàng</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>天<rt>tiān</rt></ruby>，<ruby>与<rt>yǔ</rt></ruby><ruby>臣<rt>chén</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>。<br><ruby>若<rt>ruò</rt></ruby><ruby>士<rt>shì</rt></ruby><ruby>必<rt>bì</rt></ruby><ruby>怒<rt>nù</rt></ruby>，<ruby>伏<rt>fú</rt></ruby><ruby>尸<rt>shī</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>人<rt>rén</rt></ruby>，<ruby>流<rt>liú</rt></ruby><ruby>血<rt>xuè</rt></ruby><ruby>五<rt>wǔ</rt></ruby><ruby>步<rt>bù</rt></ruby>，<ruby>天<rt>tiān</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>缟<rt>gǎo</rt></ruby><ruby>素<rt>sù</rt></ruby>，<ruby>今<rt>jīn</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>挺<rt>tǐng</rt></ruby><ruby>剑<rt>jiàn</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>起<rt>qǐ</rt></ruby>。<br><ruby>秦<rt>qín</rt></ruby><ruby>王<rt>wáng</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>挠<rt>náo</rt></ruby>，<ruby>长<rt>cháng</rt></ruby><ruby>跪<rt>guì</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>谢<rt>xiè</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>先<rt>xiān</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>坐<rt>zuò</rt></ruby>！<ruby>何<rt>hé</rt></ruby><ruby>至<rt>zhì</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>此<rt>cǐ</rt></ruby>！<br><ruby>寡<rt>guǎ</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>谕<rt>yù</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>：<ruby>夫<rt>fú</rt></ruby><ruby>韩<rt>hán</rt></ruby>、<ruby>魏<rt>wèi</rt></ruby><ruby>灭<rt>miè</rt></ruby><ruby>亡<rt>wáng</rt></ruby>，<ruby>而<rt>ér</rt></ruby><ruby>安<rt>ān</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>五<rt>wǔ</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>存<rt>cún</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>徒<rt>tú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>先<rt>xiān</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>也<rt>yě</rt></ruby>。", done: false },
        
        { grade: "九年级下册", type: "文言文", title: "送东阳马生序", author: "宋濂", text: "<ruby>余<rt>yú</rt></ruby><ruby>幼<rt>yòu</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>即<rt>jí</rt></ruby><ruby>嗜<rt>shì</rt></ruby><ruby>学<rt>xué</rt></ruby>。<br><ruby>家<rt>jiā</rt></ruby><ruby>贫<rt>pín</rt></ruby>，<ruby>无<rt>wú</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>致<rt>zhì</rt></ruby><ruby>书<rt>shū</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>观<rt>guān</rt></ruby>，<ruby>每<rt>měi</rt></ruby><ruby>假<rt>jiǎ</rt></ruby><ruby>借<rt>jiè</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>藏<rt>cáng</rt></ruby><ruby>书<rt>shū</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>家<rt>jiā</rt></ruby>，<ruby>手<rt>shǒu</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>笔<rt>bǐ</rt></ruby><ruby>录<rt>lù</rt></ruby>，<ruby>计<rt>jì</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>还<rt>huán</rt></ruby>。<br><ruby>天<rt>tiān</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>寒<rt>hán</rt></ruby>，<ruby>砚<rt>yàn</rt></ruby><ruby>冰<rt>bīng</rt></ruby><ruby>坚<rt>jiān</rt></ruby>，<ruby>手<rt>shǒu</rt></ruby><ruby>指<rt>zhǐ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>屈<rt>qū</rt></ruby><ruby>伸<rt>shēn</rt></ruby>，<ruby>弗<rt>fú</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>怠<rt>dài</rt></ruby>。<br><ruby>录<rt>lù</rt></ruby><ruby>毕<rt>bì</rt></ruby>，<ruby>走<rt>zǒu</rt></ruby><ruby>送<rt>sòng</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>敢<rt>gǎn</rt></ruby><ruby>稍<rt>shāo</rt></ruby><ruby>逾<rt>yú</rt></ruby><ruby>约<rt>yuē</rt></ruby>。<br><ruby>以<rt>yǐ</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>多<rt>duō</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>书<rt>shū</rt></ruby><ruby>假<rt>jiǎ</rt></ruby><ruby>余<rt>yú</rt></ruby>，<ruby>余<rt>yú</rt></ruby><ruby>因<rt>yīn</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>遍<rt>biàn</rt></ruby><ruby>观<rt>guān</rt></ruby><ruby>群<rt>qún</rt></ruby><ruby>书<rt>shū</rt></ruby>。<br><ruby>既<rt>jì</rt></ruby><ruby>加<rt>jiā</rt></ruby><ruby>冠<rt>guān</rt></ruby>，<ruby>益<rt>yì</rt></ruby><ruby>慕<rt>mù</rt></ruby><ruby>圣<rt>shèng</rt></ruby><ruby>贤<rt>xián</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>道<rt>dào</rt></ruby>。<br><ruby>又<rt>yòu</rt></ruby><ruby>患<rt>huàn</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>硕<rt>shuò</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>名<rt>míng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>游<rt>yóu</rt></ruby>，<ruby>尝<rt>cháng</rt></ruby><ruby>趋<rt>qū</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>外<rt>wài</rt></ruby>，<ruby>从<rt>cóng</rt></ruby><ruby>乡<rt>xiāng</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>先<rt>xiān</rt></ruby><ruby>达<rt>dá</rt></ruby><ruby>执<rt>zhí</rt></ruby><ruby>经<rt>jīng</rt></ruby><ruby>叩<rt>kòu</rt></ruby><ruby>问<rt>wèn</rt></ruby>。<br><ruby>先<rt>xiān</rt></ruby><ruby>达<rt>dá</rt></ruby><ruby>德<rt>dé</rt></ruby><ruby>隆<rt>lóng</rt></ruby><ruby>望<rt>wàng</rt></ruby><ruby>尊<rt>zūn</rt></ruby>，<ruby>门<rt>mén</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>弟<rt>dì</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>填<rt>tián</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>室<rt>shì</rt></ruby>，<ruby>未<rt>wèi</rt></ruby><ruby>尝<rt>cháng</rt></ruby><ruby>稍<rt>shāo</rt></ruby><ruby>降<rt>jiàng</rt></ruby><ruby>辞<rt>cí</rt></ruby><ruby>色<rt>sè</rt></ruby>。<br><ruby>余<rt>yú</rt></ruby><ruby>立<rt>lì</rt></ruby><ruby>侍<rt>shì</rt></ruby><ruby>左<rt>zuǒ</rt></ruby><ruby>右<rt>yòu</rt></ruby>，<ruby>援<rt>yuán</rt></ruby><ruby>疑<rt>yí</rt></ruby><ruby>质<rt>zhì</rt></ruby><ruby>理<rt>lǐ</rt></ruby>，<ruby>俯<rt>fǔ</rt></ruby><ruby>身<rt>shēn</rt></ruby><ruby>倾<rt>qīng</rt></ruby><ruby>耳<rt>ěr</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>请<rt>qǐng</rt></ruby>；<ruby>或<rt>huò</rt></ruby><ruby>遇<rt>yù</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>叱<rt>chì</rt></ruby><ruby>咄<rt>duō</rt></ruby>，<ruby>色<rt>sè</rt></ruby><ruby>愈<rt>yù</rt></ruby><ruby>恭<rt>gōng</rt></ruby>，<ruby>礼<rt>lǐ</rt></ruby><ruby>愈<rt>yù</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>敢<rt>gǎn</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>言<rt>yán</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>复<rt>fù</rt></ruby>；<ruby>俟<rt>sì</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>欣<rt>xīn</rt></ruby><ruby>悦<rt>yuè</rt></ruby>，<ruby>则<rt>zé</rt></ruby><ruby>又<rt>yòu</rt></ruby><ruby>请<rt>qǐng</rt></ruby><ruby>焉<rt>yān</rt></ruby>。<br><ruby>故<rt>gù</rt></ruby><ruby>余<rt>yú</rt></ruby><ruby>虽<rt>suī</rt></ruby><ruby>愚<rt>yú</rt></ruby>，<ruby>卒<rt>zú</rt></ruby><ruby>获<rt>huò</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>所<rt>suǒ</rt></ruby><ruby>闻<rt>wén</rt></ruby>。<br><ruby>当<rt>dāng</rt></ruby><ruby>余<rt>yú</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>负<rt>fù</rt></ruby><ruby>箧<rt>qiè</rt></ruby><ruby>曳<rt>yè</rt></ruby><ruby>屣<rt>xǐ</rt></ruby><ruby>行<rt>xíng</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>巨<rt>jù</rt></ruby><ruby>谷<rt>gǔ</rt></ruby><ruby>中<rt>zhōng</rt></ruby>。<br><ruby>穷<rt>qióng</rt></ruby><ruby>冬<rt>dōng</rt></ruby><ruby>烈<rt>liè</rt></ruby><ruby>风<rt>fēng</rt></ruby>，<ruby>大<rt>dà</rt></ruby><ruby>雪<rt>xuě</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>数<rt>shù</rt></ruby><ruby>尺<rt>chǐ</rt></ruby>，<ruby>足<rt>zú</rt></ruby><ruby>肤<rt>fū</rt></ruby><ruby>皲<rt>jūn</rt></ruby><ruby>裂<rt>liè</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>知<rt>zhī</rt></ruby>。<br><ruby>至<rt>zhì</rt></ruby><ruby>舍<rt>shè</rt></ruby>，<ruby>四<rt>sì</rt></ruby><ruby>支<rt>zhī</rt></ruby><ruby>僵<rt>jiāng</rt></ruby><ruby>劲<rt>jìng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>能<rt>néng</rt></ruby><ruby>动<rt>dòng</rt></ruby>，<ruby>媵<rt>yìng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>持<rt>chí</rt></ruby><ruby>汤<rt>tāng</rt></ruby><ruby>沃<rt>wò</rt></ruby><ruby>灌<rt>guàn</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>衾<rt>qīn</rt></ruby><ruby>拥<rt>yōng</rt></ruby><ruby>覆<rt>fù</rt></ruby>，<ruby>久<rt>jiǔ</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>乃<rt>nǎi</rt></ruby>         { grade: "九年级下册", type: "文言文", title: "出师表", author: "诸葛亮", text: "<ruby>先<rt>xiān</rt></ruby><ruby>帝<rt>dì</rt></ruby><ruby>创<rt>chuàng</rt></ruby><ruby>业<rt>yè</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>半<rt>bàn</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>道<rt>dào</rt></ruby><ruby>崩<rt>bēng</rt></ruby><ruby>殂<rt>cú</rt></ruby>，<ruby>今<rt>jīn</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>分<rt>fēn</rt></ruby>，<ruby>益<rt>yì</rt></ruby><ruby>州<rt>zhōu</rt></ruby><ruby>疲<rt>pí</rt></ruby><ruby>弊<rt>bì</rt></ruby>，<ruby>此<rt>cǐ</rt></ruby><ruby>诚<rt>chéng</rt></ruby><ruby>危<rt>wēi</rt></ruby><ruby>急<rt>jí</rt></ruby><ruby>存<rt>cún</rt></ruby><ruby>亡<rt>wáng</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>然<rt>rán</rt></ruby><ruby>侍<rt>shì</rt></ruby><ruby>卫<rt>wèi</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>臣<rt>chén</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>懈<rt>xiè</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>内<rt>nèi</rt></ruby>，<ruby>忠<rt>zhōng</rt></ruby><ruby>志<rt>zhì</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>士<rt>shì</rt></ruby><ruby>忘<rt>wàng</rt></ruby><ruby>身<rt>shēn</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>盖<rt>gài</rt></ruby><ruby>追<rt>zhuī</rt></ruby><ruby>先<rt>xiān</rt></ruby><ruby>帝<rt>dì</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>殊<rt>shū</rt></ruby><ruby>遇<rt>yù</rt></ruby>，<ruby>欲<rt>yù</rt></ruby><ruby>报<rt>bào</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>陛<rt>bì</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>诚<rt>chéng</rt></ruby><ruby>宜<rt>yí</rt></ruby><ruby>开<rt>kāi</rt></ruby><ruby>张<rt>zhāng</rt></ruby><ruby>圣<rt>shèng</rt></ruby><ruby>听<rt>tīng</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>先<rt>xiān</rt></ruby><ruby>帝<rt>dì</rt></ruby><ruby>遗<rt>yí</rt></ruby><ruby>德<rt>dé</rt></ruby>，<ruby>恢<rt>huī</rt></ruby><ruby>弘<rt>hóng</rt></ruby><ruby>志<rt>zhì</rt></ruby><ruby>士<rt>shì</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>气<rt>qì</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>宜<rt>yí</rt></ruby><ruby>妄<rt>wàng</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>菲<rt>fěi</rt></ruby><ruby>薄<rt>bó</rt></ruby>，<ruby>引<rt>yǐn</rt></ruby><ruby>喻<rt>yù</rt></ruby><ruby>失<rt>shī</rt></ruby><ruby>义<rt>yì</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>塞<rt>sè</rt></ruby><ruby>忠<rt>zhōng</rt></ruby><ruby>谏<rt>jiàn</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>路<rt>lù</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>宫<rt>gōng</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>府<rt>fǔ</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<ruby>俱<rt>jù</rt></ruby><ruby>为<rt>wéi</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>体<rt>tǐ</rt></ruby>，<ruby>陟<rt>zhì</rt></ruby><ruby>罚<rt>fá</rt></ruby><ruby>臧<rt>zāng</rt></ruby><ruby>否<rt>pǐ</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>宜<rt>yí</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>同<rt>tóng</rt></ruby>。<br><ruby>若<rt>ruò</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>奸<rt>jiān</rt></ruby><ruby>犯<rt>fàn</rt></ruby><ruby>科<rt>kē</rt></ruby><ruby>及<rt>jí</rt></ruby><ruby>为<rt>wéi</rt></ruby><ruby>忠<rt>zhōng</rt></ruby><ruby>善<rt>shàn</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>宜<rt>yí</rt></ruby><ruby>付<rt>fù</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>司<rt>sī</rt></ruby><ruby>论<rt>lùn</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>刑<rt>xíng</rt></ruby><ruby>赏<rt>shǎng</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>昭<rt>zhāo</rt></ruby><ruby>陛<rt>bì</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>平<rt>píng</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>理<rt>lǐ</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>宜<rt>yí</rt></ruby><ruby>偏<rt>piān</rt></ruby><ruby>私<rt>sī</rt></ruby>，<ruby>使<rt>shǐ</rt></ruby><ruby>内<rt>nèi</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>法<rt>fǎ</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>侍<rt>shì< uby>谏<rt>jiàn</rt></ruby>，<ruby>门<rt>mén</rt></ruby><ruby>庭<rt>tíng</rt></ruby><ruby>若<rt>ruò</rt></ruby><ruby>市<rt>shì</rt></ruby>；<ruby>数<rt>shù</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>后<rt>hòu</rt></ruby>，<ruby>时<rt>shí</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>间<rt>jiàn</rt></ruby><ruby>进<rt>jìn</rt></ruby>；<ruby>期<rt>jī</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>后<rt>hòu</rt></ruby>，<ruby>虽<rt>suī</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>言<rt>yán</rt></ruby>，<ruby>无<rt>wú</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>进<rt>jìn</rt></ruby><ruby>者<rt>zhě</rt></ruby>。<br><ruby>燕<rt>yān</rt></ruby>、<ruby>赵<rt>zhào</rt></ruby>、<ruby>韩<rt>hán</rt></ruby>、<ruby>魏<rt>wèi</rt></ruby><ruby>闻<rt>wén</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>皆<rt>jiē</rt></ruby><ruby>朝<rt>cháo</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>齐<rt>qí</rt></ruby>。<br><ruby>此<rt>cǐ</rt></ruby><ruby>所<rt>suǒ</rt></ruby><ruby>谓<rt>wèi</rt></ruby><ruby>战<rt>zhàn</rt></ruby><ruby>胜<rt>shèng</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>朝<rt>cháo</rt></ruby><ruby>廷<rt>tíng</rt></ruby>。", done: false },       
    ],
    let examActiveSet = new Set();
    // 新增：缓存每个篇目的考核题目，保证提交时一致
    let examCache = {};
    let saveData = localStorage.getItem("poems");
    if (saveData) {
        let localPoems = JSON.parse(saveData);
        poems.forEach(p => {
            let match = localPoems.find(item => item.title === p.title);
            if (match) p.done = match.done;
        });
    }

    function save() {
        localStorage.setItem("poems", JSON.stringify(poems));
    }

    // 随机考核：随机展示上句或下句
    function generateExercises(poem) {
        let cleanText = poem.text.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
        let sentences = cleanText.split(/[，。！？；\n]/).map(s => s.trim()).filter(s => s.length > 1);
        let exercises = [];
        for (let i = 0; i < sentences.length - 1; i += 2) {
            let first = sentences[i];
            let second = sentences[i + 1];
            if (Math.random() < 0.5) {
                exercises.push({ given: first, expected: second, isFirstGiven: true });
            } else {
                exercises.push({ given: second, expected: first, isFirstGiven: false });
            }
        }
        return exercises;
    }

    function resetExamInputs(index) {
        let exList = examCache[index] || [];
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            if (inputEl) {
                inputEl.value = '';
                inputEl.style.borderColor = '#ccc';
            }
            if (errEl) errEl.style.display = 'none';
        });
        let successMsg = document.getElementById('success_' + index);
        if (successMsg) successMsg.style.display = 'none';
    }

    function render() {
        let box = document.getElementById("list");
        box.innerHTML = "";
        let grade = document.getElementById("gradeSelect").value;
        let key = document.getElementById("search").value;
        let arr = poems.filter(p => (grade == "全部" || p.grade == grade) && p.title.includes(key));

        document.getElementById("total").innerHTML = poems.length;
        let finish = poems.filter(p => p.done).length;
        document.getElementById("done").innerHTML = finish;
        document.getElementById("progressBar").style.width = (poems.length ? (finish / poems.length * 100) : 0) + "%";

        arr.forEach(p => {
            let realIndex = poems.findIndex(item => item.title === p.title);
            let isExamActive = examActiveSet.has(realIndex);
            let div = document.createElement("div");
            div.className = "card " + (p.done ? "finished" : "");

            let html = `
                <h3>${p.title}</h3>
                <p class="author">${p.author} &nbsp;|&nbsp; ${p.grade}</p>
                <button class="btn-view" id="viewBtn_${realIndex}" ${isExamActive ? 'style="display:none;"' : ''} onclick="showText(${realIndex})">查看原文</button>
            `;

            if (p.done) {
                html += `<button class="btn-cancel" onclick="cancelCheck(${realIndex})" style="margin-left:10px;">取消打卡</button>`;
            } else {
                html += `<button class="btn-success" onclick="showExam(${realIndex})" style="margin-left:10px;">${isExamActive ? '关闭考核' : '开始考核'}</button>`;
            }

            html += `<div class="text" id="text${realIndex}" oncopy="return false;" oncut="return false;" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">${p.text}</div>`;

            // 使用缓存的题目或空数组
            let exList = examCache[realIndex] || [];
            html += `<div class="exam-box${isExamActive ? ' show' : ''}" id="exam${realIndex}">`;
            if (exList.length > 0) {
                html += `<p style="color:#e6a23c; margin-top:0;"><strong>📝 考核：随机给出上句或下句，请填写另一句（忽略标点）</strong></p>`;
                exList.forEach((ex, qIdx) => {
                    let rowHtml = '';
                    if (ex.isFirstGiven) {
                        rowHtml = `<span class="given-text">${ex.given}</span><input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入下句">`;
                    } else {
                        rowHtml = `<input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入上句"><span class="given-text">${ex.given}</span>`;
                    }
                    html += `
                    <div class="question">
                        <div class="q-row">${rowHtml}</div>
                        <div class="err-msg" id="err_${realIndex}_${qIdx}">× 错误</div>
                    </div>`;
                });
                html += `<button class="btn-success" style="width:100%; margin-top:10px;" onclick="submitExam(${realIndex})">提交答案</button>`;
                html += `<div class="success-msg" id="success_${realIndex}">🎉 恭喜你，全部正确，打卡成功！</div>`;
            } else {
                html += `<p style="color:#999;">该篇目暂无支持自动匹配的上下句。</p>`;
            }
            html += `</div>`;
            div.innerHTML = html;
            box.appendChild(div);
        });
    }

    function showText(i) {
        document.getElementById("text" + i).classList.toggle("show");
        document.getElementById("exam" + i).classList.remove("show");
    }

    function showExam(i) {
        let examBox = document.getElementById("exam" + i);
        let textBox = document.getElementById("text" + i);
        let viewBtn = document.getElementById("viewBtn_" + i);
        if (examBox.classList.contains("show")) {
            // 关闭考核
            examBox.classList.remove("show");
            examActiveSet.delete(i);
            delete examCache[i]; // 清除缓存
            if (viewBtn) viewBtn.style.display = 'inline-block';
            resetExamInputs(i);
        } else {
            // 打开考核：生成新题目并缓存
            let newExercises = generateExercises(poems[i]);
            examCache[i] = newExercises;
            examActiveSet.add(i);
            if (viewBtn) viewBtn.style.display = 'none';
            if (textBox) textBox.classList.remove("show");
            // 重新渲染该卡片以显示新题目
            render();
            return;
        }
        render();
    }

    function submitExam(index) {
        let p = poems[index];
        let exList = examCache[index];
        if (!exList) {
            alert("题目数据丢失，请重新打开考核");
            return;
        }
        let allCorrect = true;
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            if (!inputEl) return;
            let userAns = inputEl.value.trim().replace(/[，,。.！!？?；;：:、""''（）《》【】\s]/g, "");
            let standardAns = ex.expected.replace(/[，,。.！!？?；;：:、""''（）《》【】\s]/g, "");
            if (userAns === standardAns && userAns !== "") {
                inputEl.style.borderColor = "#67c23a";
                errEl.style.display = "none";
            } else {
                inputEl.style.borderColor = "#f56c6c";
                errEl.style.display = "inline";
                allCorrect = false;
            }
        });

        if (allCorrect) {
            document.getElementById('success_' + index).style.display = "block";
            poems[index].done = true;
            save();
            examActiveSet.delete(index);
            delete examCache[index];
            let viewBtn = document.getElementById('viewBtn_' + index);
            if (viewBtn) viewBtn.style.display = 'inline-block';
            exList.forEach((ex, qIdx) => {
                let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
                if (inputEl) inputEl.disabled = true;
            });
            setTimeout(() => { render(); }, 1200);
        } else {
            document.getElementById('success_' + index).style.display = "none";
        }
    }

    function cancelCheck(i) {
        poems[i].done = false;
        examActiveSet.delete(i);
        delete examCache[i];
        save();
        render();
    }

    function darkMode() {
        document.body.classList.toggle("dark");
    }

    document.getElementById("gradeSelect").onchange = render;
    document.getElementById("search").oninput = render;
    render();
</script>

      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker 注册成功', reg.scope))
        .catch(err => console.error('Service Worker 注册失败', err));
    });
  }
</script>
