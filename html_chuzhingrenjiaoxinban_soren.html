<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚儒升学_初中必背古诗文打卡通关</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #333; }
        header { background: white; color: #333; text-align: center; padding: 25px; border-bottom: 1px solid #eee; }
        .controls { background: white; padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
        button { background: #409eff; color: white; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .btn-success { background: #67c23a; }
        .btn-cancel { background: #f56c6c; }
        .btn-view { background: #409eff; }
        .progress { background: white; margin: 15px; padding: 15px; border-radius: 15px; }
        .bar { height: 15px; background: #eee; border-radius: 10px; overflow: hidden; }
        .bar div { height: 100%; background: #67c23a; width: 0%; transition: width 0.3s; }
        .container { padding: 15px; }
        .card { background: white; margin-bottom: 15px; padding: 18px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,.08); transition: 0.3s; }
        .card h3 { margin: 0 0 5px; }
        .author { color: #888; font-size: 0.9em; }
        .text { display: none; margin-top: 15px; line-height: 2.3; background: #fafafa; padding: 15px; border-radius: 10px; font-size: 1.1em; text-align: center; }
        .text.show { display: block; }
        ruby { margin-right: 2px; }
        rt { font-size: 0.55em; color: #777; }
        .exam-box { display: none; margin-top: 15px; background: #fffbe6; padding: 15px; border-radius: 10px; border: 1px dashed #e6a23c; }
        .exam-box.show { display: block; }
        .question { margin-bottom: 16px; }
        .q-row { display: flex; align-items: center; gap: 10px; }
        .given-text { white-space: nowrap; font-weight: bold; color: #333; }
        .question input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .question input:focus { outline: none; border-color: #67c23a; }
        .err-msg { color: #f56c6c; font-size: 0.85em; display: none; margin-top: 4px; }
        .success-msg { display: none; color: #67c23a; font-weight: bold; text-align: center; margin-top: 15px; font-size: 1.2em; }
        .finished { border-left: 5px solid #67c23a; background: #f0f9eb; }
        .dark { background: #1e1e1e; color: #ddd; }
        .dark header, .dark .card, .dark .controls, .dark .progress { background: #2b2b2b; border-color: #444; }
        .dark .text { background: #333; }
        .dark .exam-box { background: #3a3324; border-color: #8c734b; }
        .dark input { background: #444; color: white; border-color: #555; }
        .text {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
<header>
    <h1>|尚儒升学_初中必背古诗文打卡通关 Soren参与制作|</h1>
    <p>人教版七—九年级上下册（全册通关版）</p>
</header>

<div class="controls">
    <select id="gradeSelect">
        <option value="全部">全部年级</option>
        <option>七年级上册</option>
        <option>七年级下册</option>
        <option>八年级上册</option>
        <option>八年级下册</option>
        <option>九年级上册</option>
        <option>九年级下册</option>
    </select>
    <input id="search" placeholder="搜索古诗文...">
    <button onclick="darkMode()">夜间模式</button>
</div>

<div class="progress">
    <p>完成：<span id="done">0</span> / <span id="total">0</span></p>
    <div class="bar"><div id="progressBar"></div></div>
</div>

<div id="list" class="container"></div>

<div class="card" style="margin-top:20px; color:#888; font-size:0.9em;">
    <h3>免责声明</h3>
    <p>1. 本工具内古诗文原文、作者及分类依据人教版初中语文教材整理，版权归原作者及出版社所有。注音仅供学习参考。</p>
    <p>2. 本工具仅为背诵辅助练习，考核题目由系统自动生成，非正式考试标准，请以教材和教师指导为准。</p>
    <p>3. 打卡进度存储于您的浏览器本地，不会上传服务器；清除浏览器数据可能导致进度丢失。</p>
    <p>4. 请勿用于商业用途，个人学习、教学演示可自由使用。如有问题请联系我们。</p>
    <p>使用本工具即视为同意以上声明。</p>
</div>

<script>
    // ========== 完整数据库（补充后） ==========
    let poems = [
        { grade: "七年级上册", type: "古诗", title: "观沧海", author: "曹操", text: "<ruby>东<rt>dōng</rt></ruby><ruby>临<rt>lín</rt></ruby><ruby>碣<rt>jié</rt></ruby><ruby>石<rt>shí</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>观<rt>guān</rt></ruby><ruby>沧<rt>cāng</rt></ruby><ruby>海<rt>hǎi</rt></ruby>。<br><ruby>水<rt>shuǐ</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>澹<rt>dàn</rt></ruby><ruby>澹<rt>dàn</rt></ruby>，<ruby>山<rt>shān</rt></ruby><ruby>岛<rt>dǎo</rt></ruby><ruby>竦<rt>sǒng</rt></ruby><ruby>峙<rt>zhì</rt></ruby>。<br><ruby>树<rt>shù</rt></ruby><ruby>木<rt>mù</rt></ruby><ruby>丛<rt>cóng</rt></ruby><ruby>生<rt>shēng</rt></ruby>，<ruby>百<rt>bǎi</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>丰<rt>fēng</rt></ruby><ruby>茂<rt>mào</rt></ruby>。<br><ruby>秋<rt>qiū</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>萧<rt>xiāo</rt></ruby><ruby>瑟<rt>sè</rt></ruby>，<ruby>洪<rt>hóng</rt></ruby><ruby>波<rt>bō</rt></ruby><ruby>涌<rt>yǒng</rt></ruby><ruby>起<rt>qǐ</rt></ruby>。<br><ruby>日<rt>rì</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>若<rt>ruò</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>中<rt>zhōng</rt></ruby>；<br><ruby>星<rt>xīng</rt></ruby><ruby>汉<rt>hàn</rt></ruby><ruby>灿<rt>càn</rt></ruby><ruby>烂<rt>làn</rt></ruby>，<ruby>若<rt>ruò</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>里<rt>lǐ</rt></ruby>。<br><ruby>幸<rt>xìng</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>至<rt>zhì</rt></ruby><ruby>哉<rt>zāi</rt></ruby>，<ruby>歌<rt>gē</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>咏<rt>yǒng</rt></ruby><ruby>志<rt>zhì</rt></ruby>。", done: false },
        // ... 此处请粘贴之前回答中完整的 poems 数组，因篇幅限制这里省略，实际使用时需包含所有篇目
        // 请将上一轮回答中从七年级上册到九年级下册的所有诗篇文章数据完整复制在此处
    ];

    let examActiveSet = new Set();
    let saveData = localStorage.getItem("poems");
    if (saveData) {
        let localPoems = JSON.parse(saveData);
        poems.forEach(p => {
            let match = localPoems.find(item => item.title === p.title);
            if (match) p.done = match.done;
        });
    }

    function save() {
        localStorage.setItem("poems", JSON.stringify(poems));
    }

    // 随机考核：随机展示上句或下句，并标记位置
    function generateExercises(poem) {
        let cleanText = poem.text.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
        let sentences = cleanText.split(/[，。！？；\n]/).map(s => s.trim()).filter(s => s.length > 1);
        let exercises = [];
        for (let i = 0; i < sentences.length - 1; i += 2) {
            let first = sentences[i];
            let second = sentences[i + 1];
            if (Math.random() < 0.5) {
                // 展示上句，填写下句，输入框在后面
                exercises.push({ given: first, expected: second, isFirstGiven: true });
            } else {
                // 展示下句，填写上句，输入框在前面
                exercises.push({ given: second, expected: first, isFirstGiven: false });
            }
        }
        return exercises;
    }

    function resetExamInputs(index) {
        let p = poems[index];
        let exList = generateExercises(p);
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            if (inputEl) {
                inputEl.value = '';
                inputEl.style.borderColor = '#ccc';
            }
            if (errEl) errEl.style.display = 'none';
        });
        let successMsg = document.getElementById('success_' + index);
        if (successMsg) successMsg.style.display = 'none';
    }

    function render() {
        let box = document.getElementById("list");
        box.innerHTML = "";
        let grade = document.getElementById("gradeSelect").value;
        let key = document.getElementById("search").value;
        let arr = poems.filter(p => (grade == "全部" || p.grade == grade) && p.title.includes(key));

        document.getElementById("total").innerHTML = poems.length;
        let finish = poems.filter(p => p.done).length;
        document.getElementById("done").innerHTML = finish;
        document.getElementById("progressBar").style.width = (poems.length ? (finish / poems.length * 100) : 0) + "%";

        arr.forEach(p => {
            let realIndex = poems.findIndex(item => item.title === p.title);
            let isExamActive = examActiveSet.has(realIndex);
            let div = document.createElement("div");
            div.className = "card " + (p.done ? "finished" : "");

            let html = `
                <h3>${p.title}</h3>
                <p class="author">${p.author} &nbsp;|&nbsp; ${p.grade}</p>
                <button class="btn-view" id="viewBtn_${realIndex}" ${isExamActive ? 'style="display:none;"' : ''} onclick="showText(${realIndex})">查看原文</button>
            `;

            if (p.done) {
                html += `<button class="btn-cancel" onclick="cancelCheck(${realIndex})" style="margin-left:10px;">取消打卡</button>`;
            } else {
                html += `<button class="btn-success" onclick="showExam(${realIndex})" style="margin-left:10px;">${isExamActive ? '关闭考核' : '开始考核'}</button>`;
            }

            html += `<div class="text" id="text${realIndex}" oncopy="return false;" oncut="return false;" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">${p.text}</div>`;

            let exList = generateExercises(p);
            html += `<div class="exam-box${isExamActive ? ' show' : ''}" id="exam${realIndex}">`;
            if (exList.length > 0) {
                html += `<p style="color:#e6a23c; margin-top:0;"><strong>📝 考核：随机给出上句或下句，请填写另一句（自动忽略标点）</strong></p>`;
                exList.forEach((ex, qIdx) => {
                    let rowHtml = '';
                    if (ex.isFirstGiven) {
                        // 展示上句，输入框在后面
                        rowHtml = `<span class="given-text">${qIdx + 1}. ${ex.given}</span><input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入下句">`;
                    } else {
                        // 展示下句，输入框在前面
                        rowHtml = `<input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入上句"><span class="given-text">${qIdx + 1}. ${ex.given}</span>`;
                    }
                    html += `
                    <div class="question">
                        <div class="q-row">${rowHtml}</div>
                        <div class="err-msg" id="err_${realIndex}_${qIdx}">× 错误</div>
                    </div>`;
                });
                html += `<button class="btn-success" style="width:100%; margin-top:10px;" onclick="submitExam(${realIndex})">提交答案</button>`;
                html += `<div class="success-msg" id="success_${realIndex}">🎉 恭喜你，全部正确，打卡成功！</div>`;
            } else {
                html += `<p style="color:#999;">该篇目暂无支持自动匹配的上下句。</p>`;
            }
            html += `</div>`;
            div.innerHTML = html;
            box.appendChild(div);
        });
    }

    function showText(i) {
        document.getElementById("text" + i).classList.toggle("show");
        document.getElementById("exam" + i).classList.remove("show");
    }

    function showExam(i) {
        let examBox = document.getElementById("exam" + i);
        let textBox = document.getElementById("text" + i);
        let viewBtn = document.getElementById("viewBtn_" + i);
        if (examBox.classList.contains("show")) {
            examBox.classList.remove("show");
            examActiveSet.delete(i);
            if (viewBtn) viewBtn.style.display = 'inline-block';
            resetExamInputs(i);
        } else {
            examBox.classList.add("show");
            examActiveSet.add(i);
            if (viewBtn) viewBtn.style.display = 'none';
            if (textBox) textBox.classList.remove("show");
            resetExamInputs(i);
        }
    }

    function submitExam(index) {
        let p = poems[index];
        let exList = generateExercises(p);
        let allCorrect = true;
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            let userAns = inputEl.value.trim().replace(/[。，！？；\s]/g, "");
            let standardAns = ex.expected.replace(/[。，！？；\s]/g, "");
            if (userAns === standardAns && userAns !== "") {
                inputEl.style.borderColor = "#67c23a";
                errEl.style.display = "none";
            } else {
                inputEl.style.borderColor = "#f56c6c";
                errEl.style.display = "inline";
                allCorrect = false;
            }
        });
        if (allCorrect) {
            document.getElementById('success_' + index).style.display = "block";
            poems[index].done = true;
            save();
            examActiveSet.delete(index);
            let viewBtn = document.getElementById('viewBtn_' + index);
            if (viewBtn) viewBtn.style.display = 'inline-block';
            exList.forEach((ex, qIdx) => {
                let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
                if (inputEl) inputEl.disabled = true;
            });
            setTimeout(() => { render(); }, 1200);
        } else {
            document.getElementById('success_' + index).style.display = "none";
        }
    }

    function cancelCheck(i) {
        poems[i].done = false;
        examActiveSet.delete(i);
        save();
        render();
    }

    function darkMode() {
        document.body.classList.toggle("dark");
    }

    document.getElementById("gradeSelect").onchange = render;
    document.getElementById("search").oninput = render;
    render();
</script>
</body>
</html>
