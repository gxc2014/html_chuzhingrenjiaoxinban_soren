        { grade: "七年级上册", type: "文言文", title: "《世说新语》二则·陈太丘与友期行", author: "刘义庆", text: "<ruby>陈<rt>chén</rt></ruby><ruby>太<rt>tài</rt></ruby><ruby>丘<rt>qiū</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>友<rt>yǒu</rt></ruby><ruby>期<rt>qī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>期<rt>qī</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>中<rt>zhōng</rt></ruby>。<br><ruby>过<rt>guò</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<ruby>太<rt>tài</rt></ruby><ruby>丘<rt>qiū</rt></ruby><ruby>舍<rt>shě</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>去<rt>qù</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>乃<rt>nǎi</rt></ruby><ruby>至<rt>zhì</rt></ruby>。<br><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>七<rt>qī</rt></ruby><ruby>岁<rt>suì</rt></ruby>，<ruby>门<rt>mén</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>戏<rt>xì</rt></ruby>。<br><ruby>客<rt>kè</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby>：<ruby>尊<rt>zūn</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>不<rt>fǒu</rt></ruby>？<br><ruby>答<rt>dá</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>待<rt>dài</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>久<rt>jiǔ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<ruby>已<rt>yǐ</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>友<rt>yǒu</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>便<rt>biàn</rt></ruby><ruby>怒<rt>nù</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>非<rt>fēi</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>哉<rt>zāi</rt></ruby>！<ruby>与<rt>yǔ</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>期<rt>qī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>相<rt>xiāng</rt></ruby><ruby>委<rt>wěi</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>元<rt>yuán</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>君<rt>jūn</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>期<rt>qī</rt></ruby><ru y><ruby>乐<rt>lè</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>知<rt>zhī</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>好<rt>hào</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>者<rt>zhě</rt></ruby>，<ruby>好<rt>hào</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>乐<rt>lè</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>者<rt>zhě</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>饭<rt>fàn</rt></ruby><ruby>疏<rt>shū</rt></ruby><ruby>食<rt>shí</rt></ruby><ruby>饮<rt>yǐn</rt></ruby><ruby>水<rt>shuǐ</rt></ruby>，<ruby>曲<rt>qū</rt></ruby><ruby>肱<rt>gōng</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>枕<rt>zhěn</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>乐<rt>lè</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>三<rt>sān</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>必<rt>bì</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>我<rt>wǒ</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>焉<rt>yān</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>川<rt>chuān</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>逝<rt>shì</rt></ruby><ruby>者<rt>zhě</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>斯<rt>sī</rt></ruby><ruby>夫<rt>fū</rt></ruby>，<ruby>不<rt>bù</rt></ruby><ruby>舍<rt>shě</rt></ruby><ruby>昼<rt>zhòu</rt></ruby><ruby>夜<rt>yè</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>三<rt>sān</rt></ruby><ruby>军<rt>jūn</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>夺<rt>duó</rt></ruby><ruby>帅<rt>shuài</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>匹<rt>pǐ</rt></ruby><ruby>夫<rt>fū</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>夺<rt>duó</rt></ruby><ruby>志<rt>zhì</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>子<rt>zǐ</rt></ruby><ruby>夏<rt>xià</rt></ruby><ruby>曰<rt>yuē</rt></ruby>：<ruby>博<rt>bó</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>笃<rt>dǔ</rt></ruby><ruby>志<rt>zhì</rt></ruby>，<ruby>切<rt>qiè</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>近<rt>jìn</rt></ruby><ruby>思<rt>sī</rt></ruby>，<ruby>仁<rt>rén</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>。", done: false },
        { grade: "七年级上册", type: "文言文", title: "诫子书", author: "诸葛亮", text: "<ruby>夫<rt>fū</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>子<rt>zǐ</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>静<rt>jìng</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>修<rt>xiū</rt></ruby><ruby>身<rt>shēn</rt></ruby>，<ruby>俭<rt>jiǎn</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>养<rt>yǎng</rt></ruby><ruby>德<rt>dé</rt></ruby>。<br><ruby>非<rt>fēi</rt></ruby><ruby>淡<rt>dàn</rt></ruby><ruby>泊<rt>bó</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>志<rt>zhì</rt></ruby>，<ruby>非<rt>fēi</rt></ruby><ruby>宁<rt>níng</rt></ruby><ruby>静<rt>jìng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>致<rt>zhì</rt></ruby><ruby>远<rt>yuǎn</rt></ruby>。<br><ruby>夫<rt>fū</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>须<rt>xū</rt></ruby><ruby>静<rt>jìng</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>才<rt>cái</rt></ruby><ruby>须<rt>xū</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>也<rt>yě</rt></ruby>，<ruby>非<rt>fēi</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>广<rt>guǎng</rt></ruby><ruby>才<rt>cái</rt></ruby>，<ruby>非<rt>fēi</rt></ruby><ruby>志<rt>zhì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>学<rt>xué</rt></ruby>。<br><ruby>淫<rt>yín</rt></ruby><ruby>慢<rt>màn</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>能<rt>néng</rt></ruby><ruby>励<rt>lì</rt></ruby><ruby>精<rt>jīng</rt></ruby>，<ruby>险<rt>xiǎn</rt></ruby><ruby>躁<rt>zào</rt></ruby><ruby>则<rt>zé</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>能<rt>néng</rt></ruby><ruby>治<rt>zhì</rt></ruby><ruby>性<rt>xìng</rt></ruby>。<br><ruby>年<rt>nián</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>驰<rt>chí</rt></ruby>，<ruby>意<rt>yì</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>遂<rt>suì</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>枯<rt>kū</rt></ruby><ruby>落<rt>luò</rt></ruby>，<ruby>多<rt>duō</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>接<rt>jiē</rt></ruby><ruby>世<rt>shì</rt></ruby>，<ruby>悲<rt>bēi</rt></ruby><ruby>守<rt>shǒu</rt></ruby><ruby>穷<rt>qióng</rt></ruby><ruby>庐<rt>lú</rt></ruby>，<ruby>将<rt>jiāng</rt></ruby><ruby>复<rt>fù</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>及<rt>jí</rt></ruby>！", done: false },
        { grade: "七年级上册", type: "文言文", title: "狼", author: "蒲松龄", text: "<ruby>一<rt>yī</rt></ruby><ruby>屠<rt>tú</rt></ruby><ruby>晚<rt>wǎn</rt></ruby><ruby>归<rt>guī</rt></ruby>，<ruby>担<rt>dàn</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>肉<rt>ròu</rt></ruby><ruby>尽<rt>jìn</rt></ruby>，<ruby>止<rt>zhǐ</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>剩<rt>shèng</rt></ruby><ruby>骨<rt>gǔ</rt></ruby>。<br><ruby>途<rt>tú</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>两<rt>liǎng</rt></ruby><ruby>狼<rt>láng</rt></ruby>，<ruby>缀<rt>zhuì</rt></ruby><ruby>行<rt>xíng</rt></ruby><ruby>甚<rt>shèn</rt></ruby><ruby>远<rt>yuǎn</rt></ruby>。<br><ruby>屠<rt>tú</rt></ruby><ruby>惧<rt>jù</rt></ruby>，<ruby>投<rt>tóu</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>骨<rt>gǔ</rt></ruby>。<br><ruby>一<rt>yī</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>骨<rt>gǔ</rt></ruby><ruby>止<rt>zhǐ</rt></ruby>，<ruby>一<rt>yī</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>仍<rt>réng</rt></ruby><ruby>从<rt>cóng</rt></ruby>。<br><ruby>复<rt>fù</rt></ruby><ruby>投<rt>tóu</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>后<rt>hòu</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>止<rt>zhǐ</rt></ruby><ruby>而<rt>ér</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>又<rt>yòu</rt></ruby><ruby>至<rt>zhì</rt></ruby>。<br><ruby>骨<rt>gǔ</rt></ruby><ruby>已<rt>yǐ</rt></ruby><ruby>尽<rt>jìn</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>，<ruby>而<rt>ér</rt></ruby><ruby>两<rt>liǎng</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>并<rt>bìng</rt></ruby><ruby>驱<rt>qū</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>故<rt>gù</rt></ruby>。<br><ruby>屠<rt>tú</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>窘<rt>jiǒng</rt></ruby>，<ruby>恐<rt>kǒng</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>受<rt>shòu</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>敌<rt>dí</rt></ruby>。<br><ruby>顾<rt>gù</rt></ruby><ruby>野<rt>yě</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>麦<rt>mài</rt></ruby><ruby>场<rt>chǎng</rt></ruby>，<ruby>场<rt>chǎng</rt></ruby><ruby>主<rt>zhǔ</rt></ruby><ruby>积<rt>jī</rt></ruby><ruby>薪<rt>xīn</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<ruby>苫<rt>shàn</rt></ruby><ruby>蔽<rt>bì</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>丘<rt>qiū</rt></ruby>。<br><ruby>屠<rt>tú</rt></ruby><ruby>乃<rt>nǎi</rt></ruby><ruby>奔<rt>bēn</rt></ruby><ruby>倚<rt>yǐ</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>下<rt>xià</rt></ruby>，<ruby>弛<rt>chí</rt></ruby><ruby>担<rt>dàn</rt></ruby><ruby>持<rt>chí</rt></ruby><ruby>刀<rt>dāo</rt></ruby>。<br><ruby>狼<rt>láng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>敢<rt>gǎn</rt></ruby><ruby>前<rt>qián</rt></ruby>，<ruby>眈<rt>dān</rt></ruby><ruby>眈<rt>dān</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>向<rt>xiàng</rt></ruby>。<br><ruby>少<rt>shǎo</rt></ruby><ruby>时<rt>shí</rt></ruby>，<ruby>一<rt>yī</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>径<rt>jìng</rt></ruby><ruby>去<rt>qù</rt></ruby>，<ruby>其<rt>qí</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>犬<rt>quǎn</rt></ruby><ruby>坐<rt>zuò</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>前<rt>qián</rt></ruby>。<br><ruby>久<rt>jiǔ</rt></ruby><ruby>之<rt>zhī</rt></ruby>，<ruby>目<rt>mù</rt></ruby><ruby>似<rt>sì</rt></ruby><ruby>瞑<rt>míng</rt></ruby>，<ruby>意<rt>yì</rt></ruby><ruby>暇<rt>xiá</rt></ruby><ruby>甚<rt>shèn</rt></ruby>。<br><ruby>屠<rt>tú</rt></ruby><ruby>暴<rt>bào</rt></ruby><ruby>起<rt>qǐ</rt></ruby>，<ruby>以<rt>yǐ</rt></ruby><ruby>刀<rt>dāo</rt></ruby><ruby>劈<rt>pī</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>首<rt>shǒu</rt></ruby>，<ruby>又<rt>yòu</rt></ruby><ruby>数<rt>shù</rt></ruby><ruby>刀<rt>dāo</rt></ruby><ruby>毙<rt>bì</rt></ruby><ruby>之<rt>zhī</rt></ruby>。<br><ruby>方<rt>fāng</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<ruby>转<rt>zhuǎn</rt></ruby><ruby>视<rt>shì</rt></ruby><ruby>积<rt>jī</rt></ruby><ruby>薪<rt>xīn</rt></ruby><ruby>后<rt>hòu</rt></ruby>，<ruby>一<rt>yī</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>洞<rt>dòng</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<ruby>意<rt>yì</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>隧<rt>suì</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>攻<rt>gōng</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>也<rt>yě</rt></ruby>。<br><ruby>身<rt>shēn</rt></ruby><ruby>已<rt>yǐ</rt></ruby><ruby>半<rt>bàn</rt></ruby><ruby>入<rt>rù</rt></ruby>，<ruby>止<rt>zhǐ</rt></ruby><ruby>露<rt>lù</rt></ruby><ruby>尻<rt>kāo</rt></ruby><ruby>尾<rt>wěi</rt></ruby>。<br><ruby>屠<rt>tú</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>后<rt>hòu</rt></ruby><ruby>断<rt>duàn</rt></ruby><ruby>其<rt>qí</rt></ruby><ruby>股<rt>gǔ</rt></ruby>，<ruby>亦<rt>yì</rt></ruby><ruby>毙<rt>bì</rt></ruby><ruby>之<rt>zhī</rt></ruby>。<br><ruby>乃<rt>nǎi</rt></ruby><ruby>悟<rt>wù</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>狼<rt>láng</rt></ruby><ruby>假<rt>jiǎ</rt></ruby><ruby>寐<rt>mèi</rt></ruby>，<ruby>盖<rt>gài</rt></ruby><ruby>以<rt>yǐ</rt></ruby><ruby>诱<rt>yòu</rt></ruby><ruby>敌<rt>dí</rt></ruby>。<br><ruby>狼<rt>láng</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>黠<rt>xiá</rt></ruby><ruby>矣<rt>yǐ</rt></ruby>，<ruby>而<rt>ér</rt></ruby><ruby>顷<rt>qǐng</rt></ruby><ruby>刻<rt>kè</rt></ruby><ruby>两<rt>liǎng</rt></ruby><ruby>毙<rt>bì</rt></ruby>，<ruby>禽<rt>qín</rt></ruby><ruby>兽<rt>shòu</rt></ruby><ruby>之<rt>zhī</rt></ruby><ruby>变<rt>biàn</rt></ruby><ruby>诈<rt>zhà</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>哉<rt>zāi</rt></ruby>？<ruby>止<rt>zhǐ</rt></ruby><ruby>增<rt>zēng</rt></ruby><ruby>笑<rt>xiào</rt></ruby><ruby>耳<rt>ěr</rt></ruby>。", done: false },
        
        // 七年级下册
        { grade: "七年级下册", type: "古诗", title: "竹里馆", author: "王维", text: "独坐幽篁里，弹琴复长啸。<br>深林人不知，明月来相照。", done: false },
        { grade: "七年级下册", type: "古诗", title: "春夜洛城闻笛", author: "李白", text: "谁家玉笛暗飞声，散入春风满洛城。<br>此夜曲中闻折柳，何人不起故园情。", done: false },
        { grade: "七年级下册", type: "古诗", title: "逢入京使", author: "岑参", text: "故园东望路漫漫，双袖龙钟泪不干。<br>马上相逢无纸笔，凭君传语报平安。", done: false },
        { grade: "七年级下册", type: "古诗", title: "晚春", author: "韩愈", text: "草树知春不久归，百般红紫斗芳菲。<br>杨花榆荚无才思，惟解漫天作雪飞。", done: false },
        { grade: "七年级下册", type: "古诗", title: "登幽州台歌", author: "陈子昂", text: "前不见古人，后不见来者。<br>念天地之悠悠，独怆然而涕下。", done: false },
        { grade: "七年级下册", type: "古诗", title: "望岳", author: "杜甫", text: "岱宗夫如何？齐鲁青未了。<br>造化钟神秀，阴阳割昏晓。<br>荡胸生曾云，决眦入归鸟。<br>会当凌绝顶，一览众山小。", done: false },
        { grade: "七年级下册", type: "古诗", title: "登飞来峰", author: "王安石", text: "飞来山上千寻塔，闻说鸡鸣见日升。<br>不畏浮云遮望眼，自缘身在最高层。", done: false },
        { grade: "七年级下册", type: "古诗", title: "游山西村", author: "陆游", text: "莫笑农家腊酒浑，丰年留客足鸡豚。<br>山重水复疑无路，柳暗花明又一村。<br>箫鼓追随春社近，衣冠简朴古风存。<br>从今若许闲乘月，拄杖无时夜叩门。", done: false },
        { grade: "七年级下册", type: "古诗", title: "己亥杂诗（其五）", author: "龚自珍", text: "浩荡离愁白日斜，吟鞭东指即天涯。<br>落红不是无情物，化作春泥更护花。", done: false },
        { grade: "七年级下册", type: "古诗", title: "泊秦淮", author: "杜牧", text: "烟笼寒水月笼沙，夜泊秦淮近酒家。<br>商女不知亡国恨，隔江犹唱后庭花。", done: false },
        { grade: "七年级下册", type: "古诗", title: "贾生", author: "李商隐", text: "宣室求贤访逐臣，贾生才调更无伦。<br>可怜夜半虚前席，不问苍生问鬼神。", done: false },
        { grade: "七年级下册", type: "古诗", title: "过松源晨炊漆公店（其五）", author: "杨万里", text: "莫言下岭便无难，赚得行人错喜欢。<br>政入万山围子里，一山放出一山拦。", done: false },
        { grade: "七年级下册", type: "古诗", title: "约客", author: "赵师秀", text: "黄梅时节家家雨，青草池塘处处蛙。<br>有约不来过夜半，闲敲棋子落灯花。", done: false },
        { grade: "七年级下册", type: "文言文", title: "孙权劝学", author: "《资治通鉴》", text: "初，权谓吕蒙曰：卿今当涂掌事，不可不学！<br>蒙辞以军中多务。<br>权曰：孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。<br>蒙乃始就学。<br>及鲁肃过寻阳，与蒙论议，大惊曰：卿今者才略，非复吴下阿蒙！<br>蒙曰：士别三日，即更刮目相待，大兄何见事之晚乎！<br>肃遂拜蒙母，结友而别。", done: false },
        { grade: "七年级下册", type: "文言文", title: "木兰诗", author: "《乐府诗集》", text: "唧唧复唧唧，木兰当户织。<br>不闻机杼声，惟闻女叹息。<br>问女何所思，问女何所忆。女亦无所思，女亦无所忆。<br>昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。<br>阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。<br>东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。<br>旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。<br>旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。<br>万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。<br>归来见天子，天子坐明堂。策勋十二转，赏赐百千强。<br>可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。<br>爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。<br>开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。<br>出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。<br>雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？", done: false },
        { grade: "七年级下册", type: "文言文", title: "卖油翁", author: "欧阳修", text: "陈康肃公善射，当世无双，公亦以此自矜。<br>尝射于家圃，有卖油翁释担而立，睨之久而不去。<br>见其发矢十中八九，但微颔之。<br>康肃问曰：汝亦知射乎？吾射不亦精乎？<br>翁曰：无他，但手熟尔。<br>康肃忿然曰：尔安敢轻吾射！<br>翁曰：以我酌油知之。<br>乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。<br>因曰：我亦无他，惟手熟尔。<br>康肃笑而遣之。", done: false },
        { grade: "七年级下册", type: "文言文", title: "陋室铭", author: "刘禹锡", text: "山不在高，有仙则名。水不在深，有龙则灵。<br>斯是陋室，惟吾德馨。<br>苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。<br>可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。<br>南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？", done: false },
        { grade: "七年级下册", type: "文言文", title: "爱莲说", author: "周敦颐", text: "水陆草木之花，可爱者甚蕃。<br>晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。<br>予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。<br>予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。<br>噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。", done: false },

        // 八年级上册
        { grade: "八年级上册", type: "古诗", title: "野望", author: "王绩", text: "东皋薄暮望，徙倚欲何依。<br>树树皆秋色，山山唯落晖。<br>牧人驱犊返，猎马带禽归。<br>相顾无相识，长歌怀采薇。", done: false },
        { grade: "八年级上册", type: "古诗", title: "黄鹤楼", author: "崔颢", text: "昔人已乘黄鹤去，此地空余黄鹤楼。<br>黄鹤一去不复返，白云千载空悠悠。<br>晴川历历汉阳树，芳草萋萋鹦鹉洲。<br>日暮乡关何处是？烟波江上使人愁。", done: false },
        { grade: "八年级上册", type: "古诗", title: "使至塞上", author: "王维", text: "单车欲问边，属国过居延。<br>征蓬出汉塞，归雁入胡天。<br>大漠孤烟直，长河落日圆。<br>萧关逢候骑，都护在燕然。", done: false },
        { grade: "八年级上册", type: "古诗", title: "渡荆门送别", author: "李白", text: "渡远荆门外，来从楚国游。<br>山随平野尽，江入大荒流。<br>月下飞天镜，云生结海楼。<br>仍怜故乡水，万里送行舟。", done: false },
        { grade: "八年级上册", type: "古诗", title: "钱塘湖春行", author: "白居易", text: "孤山寺北贾亭西，水面初平云脚低。<br>几处早莺争暖树，谁家新燕啄春泥。<br>乱花渐欲迷人眼，浅草才能没马蹄。<br>最爱湖东行不足，绿杨阴里白沙堤。", done: false },
        { grade: "八年级上册", type: "古诗", title: "饮酒（其五）", author: "陶渊明", text: "结庐在人境，而无车马喧。<br>问君何能尔？心远地自偏。<br>采菊东篱下，悠然见南山。<br>山气日夕佳，飞鸟相与还。<br>此中有真意，欲辨已忘言。", done: false },
        { grade: "八年级上册", type: "古诗", title: "春望", author: "杜甫", text: "国破山河在，城春草木深。<br>感时花溅泪，恨别鸟惊心。<br>烽火连三月，家书抵万金。<br>白头搔更短，浑欲不胜簪。", done: false },
        { grade: "八年级上册", type: "古诗", title: "雁门太守行", author: "李贺", text: "黑云压城城欲摧，甲光向日金鳞开。<br>角声满天秋色里，塞上燕脂凝夜紫。<br>半卷红旗临易水，霜重鼓寒声不起。<br>报君黄金台上意，提携玉龙为君死。", done: false },
        { grade: "八年级上册", type: "古诗", title: "赤壁", author: "杜牧", text: "折戟沉沙铁未销，自将磨洗认前朝。<br>东风不与周郎便，铜雀春深锁二乔。", done: false },
        { grade: "八年级上册", type: "古诗", title: "渔家傲·天接云涛连晓雾", author: "李清照", text: "天接云涛连晓雾，星河欲转千帆舞。<br>仿佛梦魂归帝所，闻天语，殷勤问我归何处。<br>我报路长嗟日暮，学诗谩有惊人句。<br>九万里风鹏正举。风休住，蓬舟吹取三山去！", done: false },
        { grade: "八年级上册", type: "古诗", title: "庭中有奇树", author: "《古诗十九首》", text: "庭中有奇树，绿叶发华滋。<br>攀条折其荣，将以遗所思。<br>馨香盈怀袖，路远莫致之。<br>此物何足贵？但感别经时。", done: false },
        { grade: "八年级上册", type: "古诗", title: "龟虽寿", author: "曹操", text: "神龟虽寿，犹有竟时；腾蛇乘雾，终为土灰。<br>老骥伏枥，志在千里；烈士暮年，壮心不已。<br>盈缩之期，不但在天；养怡之福，可得永年。<br>幸甚至哉，歌以咏志。", done: false },
        { grade: "八年级上册", type: "古诗", title: "赠从弟（其二）", author: "刘桢", text: "亭亭山上松，瑟瑟谷中风。<br>风声一何盛，松枝一何劲！<br>冰霜正惨凄，终岁常端正。<br>岂不罹凝寒？松柏有本性。", done: false },
        { grade: "八年级上册", type: "古诗", title: "梁甫行", author: "曹植", text: "八方各异气，千里殊风雨。<br>剧哉边海民，寄身于草野。<br>妻子象禽兽，行止依林阻。<br>柴门何萧条，狐兔翔我宇。", done: false },
        { grade: "八年级上册", type: "文言文", title: "三峡", author: "郦道元", text: "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。<br>至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。<br>春冬之时，则素湍绿潭，回清倒影，绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。<br>每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：巴东三峡巫峡长，猿鸣三声泪沾裳。", done: false },
        { grade: "八年级上册", type: "文言文", title: "记承天寺夜游", author: "苏轼", text: "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。<br>念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。<br>庭下如积水空明，水中藻、荇交横，盖竹柏影也。<br>何夜无月？何处无竹柏？但少闲人如吾两人者耳。", done: false },
        { grade: "八年级上册", type: "文言文", title: "与朱元思书", author: "吴均", text: "风烟俱净，天山共色。从流飘荡，任意东西。<br>自富阳至桐庐一百许里，奇山异水，天下独绝。<br>水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。<br>夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。<br>泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。<br>鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。<br>横柯上蔽，在昼犹昏；疏条交映，有时见日。", done: false },
        { grade: "八年级上册", type: "文言文", title: "得道多助，失道寡助", author: "《孟子》", text: "天时不如地利，地利不如人和。<br>三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。<br>城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。<br>故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。<br>得道者多助，失道者寡助。寡助之至，亲戚畔之。多助之至，天下顺之。<br>以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。", done: false },
        { grade: "八年级上册", type: "文言文", title: "富贵不能淫", author: "《孟子》", text: "景春曰：公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。<br>孟子曰：是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：往之女家，必敬必戒，无违夫子！以顺为正者，妾妇之道也。<br>居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。", done: false },
        { grade: "八年级上册", type: "文言文", title: "生于忧患，死于安乐", author: "《孟子》", text: "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。<br>故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。<br>人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。<br>入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。", done: false },
        { grade: "八年级上册", type: "文言文", title: "愚公移山", author: "《列子》", text: "太行、王屋二山，方七百里，高万仞。本在冀州之南，河阳之北。<br>北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：吾与汝毕力平险，指通豫南，达于汉阴，可乎？杂然相许。<br>其妻献疑曰：以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？<br>杂曰：投诸渤海之尾，隐土之北。<br>遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。<br>河曲智叟笑而止之曰：甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？<br>北山愚公长息曰：汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？河曲智叟亡以应。<br>操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。", done: false },
        { grade: "八年级上册", type: "文言文", title: "周亚夫军细柳", author: "司马迁", text: "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。<br>上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。<br>已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。<br>先驱曰：天子且至！军门都尉曰：将军令曰：军中闻将军令，不闻天子之诏。<br>居无何，上至，又不得入。于是上乃使使持节诏将军：吾欲入劳军。亚夫乃传言开壁门。<br>壁门士吏谓从属车骑曰：将军约，军中不得驱驰。于是天子乃按辔徐行。<br>至营，将军亚夫持兵揖曰：介胄之士不拜，请以军礼见。<br>天子为动，改容式车。使人称谢：皇帝敬劳将军。成礼而去。<br>既出军门，群臣皆惊。文帝曰：嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！称善者久之。", done: false },

        // 八年级下册
        { grade: "八年级下册", type: "古诗", title: "关雎", author: "《诗经》", text: "关关雎鸠，在河之洲。窈窕淑女，君子好逑。<br>参差荇菜，左右流之。窈窕淑女，寤寐求之。<br>求之不得，寤寐思服。悠哉悠哉，辗转反侧。<br>参差荇菜，左右采之。窈窕淑女，琴瑟友之。<br>参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。", done: false },
        { grade: "八年级下册", type: "古诗", title: "蒹葭", author: "《诗经》", text: "蒹葭苍苍，白露为霜。所谓伊人，在水一方。<br>溯洄从之，道阻且长。溯游从之，宛在水中央。<br>蒹葭萋萋，白露未晞。所谓伊人，在水之湄。<br>溯洄从之，道阻且跻。溯游从之，宛在水中坻。<br>蒹葭采采，白露未已。所谓伊人，在水之涘。<br>溯洄从之，道阻且右。溯游从之，宛在水中沚。", done: false },
        { grade: "八年级下册", type: "古诗", title: "送杜少府之任蜀州", author: "王勃", text: "城阙辅三秦，风烟望五津。<br>与君离别意，同是宦游人。<br>海内存知己，天涯若比邻。<br>无为在歧路，儿女共沾巾。", done: false },
        { grade: "八年级下册", type: "古诗", title: "望洞庭湖赠张丞相", author: "孟浩然", text: "八月湖水平，涵虚混太清。<br>气蒸云梦泽，波撼岳阳城。<br>欲济无舟楫，端居耻圣明。<br>坐观垂钓者，徒有羡鱼情。", done: false },
        { grade: "八年级下册", type: "古诗", title: "式微", author: "《诗经·邶风》", text: "式微，式微，胡不归？微君之故，胡为乎中露！<br>式微，式微，胡不归？微君之躬，胡为乎泥中！", done: false },
        { grade: "八年级下册", type: "古诗", title: "子衿", author: "《诗经·郑风》", text: "青青子衿，悠悠我心。纵我不往，子宁不嗣音？<br>青青子佩，悠悠我思。纵我不往，子宁不来？<br>挑兮达兮，在城阙兮。一日不见，如三月兮。", done: false },
        { grade: "八年级下册", type: "古诗", title: "石壕吏", author: "杜甫", text: "暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。<br>吏呼一何怒！妇啼一何苦！<br>听妇前致词：三男邺城戍。一男附书至，二男新战死。存者且偷生，死者长已矣！室中更无人，惟有乳下孙。有孙母未去，出入无完裙。老妪力虽衰，请从吏夜归，急应河阳役，犹得备晨炊。<br>夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。", done: false },
        { grade: "八年级下册", type: "古诗", title: "茅屋为秋风所破歌", author: "杜甫", text: "八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。<br>南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。<br>俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！<br>安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！", done: false },
        { grade: "八年级下册", type: "古诗", title: "卖炭翁", author: "白居易", text: "卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。<br>卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。<br>夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。<br>翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。<br>一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。", done: false },
        { grade: "八年级下册", type: "文言文", title: "桃花源记", author: "陶渊明", text: "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。<br>忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。<br>林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。<br>见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：不足为外人道也。<br>既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。<br>南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", done: false },
        { grade: "八年级下册", type: "文言文", title: "小石潭记", author: "柳宗元", text: "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。<br>全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。<br>潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。<br>潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。<br>坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。<br>同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：曰恕己，曰奉壹。", done: false },
        { grade: "八年级下册", type: "文言文", title: "核舟记", author: "魏学洢", text: "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。<br>舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻山高月小，水落石出，左刻清风徐来，水波不兴，石青糁之。<br>船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。<br>舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。<br>其船背稍夷，则题名其上，文曰：天启壬戌秋日，虞山王毅叔远甫刻，细若蚊足，钩画了了，其色墨。又用篆章一，文曰初平山人，其色丹。<br>通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！", done: false },
        { grade: "八年级下册", type: "文言文", title: "虽有嘉肴", author: "《礼记》", text: "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。<br>是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰学学半，其此之谓乎！", done: false },
        { grade: "八年级下册", type: "文言文", title: "大道之行也", author: "《礼记》", text: "大道之行也，天下为公。选贤与能，讲信修睦。<br>故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。<br>货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。", done: false },
        { grade: "八年级下册", type: "文言文", title: "马说", author: "韩愈", text: "世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。<br>马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？<br>策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：天下无马！呜呼！其真无马邪？其真不知马也！", done: false },

        // 九年级上册
        { grade: "九年级上册", type: "古诗", title: "月夜忆舍弟", author: "杜甫", text: "戍鼓断人行，边秋一雁声。<br>露从今夜白，月是故乡明。<br>有弟皆分散，无家问死生。<br>寄书长不达，况乃未休兵。", done: false },
        { grade: "九年级上册", type: "古诗", title: "商山早行", author: "温庭筠", text: "晨起动征铎，客行悲故乡。<br>鸡声茅店月，人迹板桥霜。<br>槲叶落山路，枳花明驿墙。<br>因思杜陵梦，凫雁满回塘。", done: false },
        { grade: "九年级上册", type: "古诗", title: "长沙过贾谊宅", author: "刘长卿", text: "三年谪宦此栖迟，万古惟留楚客悲。<br>秋草独寻人去后，寒林空见日斜时。<br>汉文有道恩犹薄，湘水无情吊岂知？<br>寂寂江山摇落处，怜君何事到天涯！", done: false },
        { grade: "九年级上册", type: "古诗", title: "左迁至蓝关示侄孙湘", author: "韩愈", text: "一封朝奏九重天，夕贬潮州路八千。<br>欲为圣明除弊事，肯将衰朽惜残年！<br>云横秦岭家何在？雪拥蓝关马不前。<br>知汝远来应有意，好收吾骨瘴江边。", done: false },
        { grade: "九年级上册", type: "古诗", title: "沁园春·雪", author: "毛泽东", text: "北国风光，千里冰封，万里雪飘。<br>望长城内外，惟余莽莽；大河上下，顿失滔滔。<br>山舞银蛇，原驰蜡象，欲与天公试比高。<br>须晴日，看红装素裹，分外妖娆。<br>江山如此多娇，引无数英雄竞折腰。<br>惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。<br>一代天骄，成吉思汗，只识弯弓射大雕。<br>俱往矣，数风流人物，还看今朝。", done: false },
        { grade: "九年级上册", type: "文言文", title: "岳阳楼记", author: "范仲淹", text: "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。<br>予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？<br>若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。<br>至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。<br>嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰先天下之忧而忧，后天下之乐而乐乎？噫！微斯人，吾谁与归？<br>时六年九月十五日。", done: false },
        { grade: "九年级上册", type: "文言文", title: "醉翁亭记", author: "欧阳修", text: "环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。<br>若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。<br>至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥。酿泉为酒，泉香而酒洌；山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。<br>已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。", done: false },
        { grade: "九年级上册", type: "文言文", title: "湖心亭看雪", author: "张岱", text: "崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。<br>是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。<br>到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余，大喜曰：湖中焉得更有此人！拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。<br>及下船，舟子喃喃曰：莫说相公痴，更有痴似相公者！", done: false },

        // 九年级下册
        { grade: "九年级下册", type: "古诗", title: "渔家傲·秋思", author: "范仲淹", text: "塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。<br>浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。", done: false },
        { grade: "九年级下册", type: "古诗", title: "江城子·密州出猎", author: "苏轼", text: "老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。<br>酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。", done: false },
        { grade: "九年级下册", type: "古诗", title: "破阵子·为陈同甫赋壮词以寄之", author: "辛弃疾", text: "醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。<br>马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！", done: false },
        { grade: "九年级下册", type: "古诗", title: "满江红·小住京华", author: "秋瑾", text: "小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。<br>四面歌残终破楚，八年风味徒思浙。<br>苦将侬强派作蛾眉，殊未屑！<br>身不得，男儿列，心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘何处觅知音？青衫湿！", done: false },
        { grade: "九年级下册", type: "古诗", title: "定风波·莫听穿林打叶声", author: "苏轼", text: "莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。<br>料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。", done: false },
        { grade: "九年级下册", type: "古诗", title: "临江仙·夜登小阁忆洛中旧游", author: "陈与义", text: "忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。<br>二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。", done: false },
        { grade: "九年级下册", type: "古诗", title: "太常引·建康中秋夜为吕叔潜赋", author: "辛弃疾", text: "一轮秋影转金波，飞镜又重磨。把酒问姮娥：被白发，欺人奈何？<br>乘风好去，长空万里，直下看山河。斫去桂婆娑，人道是，清光更多。", done: false },
        { grade: "九年级下册", type: "古诗", title: "浣溪沙·身向云山那畔行", author: "纳兰性德", text: "身向云山那畔行，北风吹断马嘶声，深秋远塞若为情！<br>一抹晚烟荒戍垒，半竿斜日旧关城。古今幽恨几时平！", done: false },
        { grade: "九年级下册", type: "文言文", title: "曹刿论战", author: "《左传》", text: "十年春，齐师伐我。公将战，曹刿请见。其乡人曰：肉食者谋之，又何间焉？刿曰：肉食者鄙，未能远谋。乃入见。<br>问：何以战？公曰：衣食所安，弗敢专也，必以分人。对曰：小惠未遍，民弗从也。公曰：牺牲玉帛，弗敢加也，必以信。对曰：小信未孚，神弗福也。公曰：小大之狱，虽不能察，必以情。对曰：忠之属也。可以一战。战则请从。<br>公与之乘，战于长勺。公将鼓之。刿曰：未可。齐人三鼓。刿曰：可矣。齐师败绩。公将驰之。刿曰：未可。下视其辙，登轼而望之，曰：可矣。遂逐齐师。<br>既克，公问其故。对曰：夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。", done: false },
        { grade: "九年级下册", type: "文言文", title: "鱼我所欲也", author: "《孟子》", text: "鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。<br>生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。<br>如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。<br>一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。<br>万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。", done: false },
        { grade: "九年级下册", type: "文言文", title: "唐雎不辱使命", author: "《战国策》", text: "秦王使人谓安陵君曰：寡人欲以五百里之地易安陵，安陵君其许寡人！安陵君曰：大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！秦王不说。安陵君因使唐雎使于秦。<br>秦王谓唐雎曰：寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？唐雎对曰：否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？<br>秦王怫然怒，谓唐雎曰：公亦尝闻天子之怒乎？唐雎对曰：臣未尝闻也。秦王曰：天子之怒，伏尸百万，流血千里。唐雎曰：大王尝闻布衣之怒乎？秦王曰：布衣之怒，亦免冠徒跣，以头抢地耳。唐雎曰：此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。挺剑而起。<br>秦王色挠，长跪而谢之曰：先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。", done: false },
        { grade: "九年级下册", type: "文言文", title: "送东阳马生序", author: "宋濂", text: "余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。<br>既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。<br>当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。", done: false },
        { grade: "九年级下册", type: "文言文", title: "出师表", author: "诸葛亮", text: "先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。<br>宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。<br>侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。<br>将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。<br>亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。<br>臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。<br>先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。<br>愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。<br>今当远离，临表涕零，不知所言。", done: false }
    ];

    let examActiveSet = new Set();
    // 新增：缓存每个篇目的考核题目，保证提交时一致
    let examCache = {};
    let saveData = localStorage.getItem("poems");
    if (saveData) {
        let localPoems = JSON.parse(saveData);
        poems.forEach(p => {
            let match = localPoems.find(item => item.title === p.title);
            if (match) p.done = match.done;
        });
    }

    function save() {
        localStorage.setItem("poems", JSON.stringify(poems));
    }

    // 随机考核：随机展示上句或下句
    function generateExercises(poem) {
        let cleanText = poem.text.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
        let sentences = cleanText.split(/[，。！？；\n]/).map(s => s.trim()).filter(s => s.length > 1);
        let exercises = [];
        for (let i = 0; i < sentences.length - 1; i += 2) {
            let first = sentences[i];
            let second = sentences[i + 1];
            if (Math.random() < 0.5) {
                exercises.push({ given: first, expected: second, isFirstGiven: true });
            } else {
                exercises.push({ given: second, expected: first, isFirstGiven: false });
            }
        }
        return exercises;
    }

    function resetExamInputs(index) {
        let exList = examCache[index] || [];
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            if (inputEl) {
                inputEl.value = '';
                inputEl.style.borderColor = '#ccc';
            }
            if (errEl) errEl.style.display = 'none';
        });
        let successMsg = document.getElementById('success_' + index);
        if (successMsg) successMsg.style.display = 'none';
    }

    function render() {
        let box = document.getElementById("list");
        box.innerHTML = "";
        let grade = document.getElementById("gradeSelect").value;
        let key = document.getElementById("search").value;
        let arr = poems.filter(p => (grade == "全部" || p.grade == grade) && p.title.includes(key));

        document.getElementById("total").innerHTML = poems.length;
        let finish = poems.filter(p => p.done).length;
        document.getElementById("done").innerHTML = finish;
        document.getElementById("progressBar").style.width = (poems.length ? (finish / poems.length * 100) : 0) + "%";

        arr.forEach(p => {
            let realIndex = poems.findIndex(item => item.title === p.title);
            let isExamActive = examActiveSet.has(realIndex);
            let div = document.createElement("div");
            div.className = "card " + (p.done ? "finished" : "");

            let html = `
                <h3>${p.title}</h3>
                <p class="author">${p.author} &nbsp;|&nbsp; ${p.grade}</p>
                <button class="btn-view" id="viewBtn_${realIndex}" ${isExamActive ? 'style="display:none;"' : ''} onclick="showText(${realIndex})">查看原文</button>
            `;

            if (p.done) {
                html += `<button class="btn-cancel" onclick="cancelCheck(${realIndex})" style="margin-left:10px;">取消打卡</button>`;
            } else {
                html += `<button class="btn-success" onclick="showExam(${realIndex})" style="margin-left:10px;">${isExamActive ? '关闭考核' : '开始考核'}</button>`;
            }

            html += `<div class="text" id="text${realIndex}" oncopy="return false;" oncut="return false;" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">${p.text}</div>`;

            // 使用缓存的题目或空数组
            let exList = examCache[realIndex] || [];
            html += `<div class="exam-box${isExamActive ? ' show' : ''}" id="exam${realIndex}">`;
            if (exList.length > 0) {
                html += `<p style="color:#e6a23c; margin-top:0;"><strong>📝 考核：随机给出上句或下句，请填写另一句（忽略标点）</strong></p>`;
                exList.forEach((ex, qIdx) => {
                    let rowHtml = '';
                    if (ex.isFirstGiven) {
                        rowHtml = `<span class="given-text">${ex.given}</span><input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入下句">`;
                    } else {
                        rowHtml = `<input type="text" id="ans_${realIndex}_${qIdx}" placeholder="请输入上句"><span class="given-text">${ex.given}</span>`;
                    }
                    html += `
                    <div class="question">
                        <div class="q-row">${rowHtml}</div>
                        <div class="err-msg" id="err_${realIndex}_${qIdx}">× 错误</div>
                    </div>`;
                });
                html += `<button class="btn-success" style="width:100%; margin-top:10px;" onclick="submitExam(${realIndex})">提交答案</button>`;
                html += `<div class="success-msg" id="success_${realIndex}">🎉 恭喜你，全部正确，打卡成功！</div>`;
            } else {
                html += `<p style="color:#999;">该篇目暂无支持自动匹配的上下句。</p>`;
            }
            html += `</div>`;
            div.innerHTML = html;
            box.appendChild(div);
        });
    }

    function showText(i) {
        document.getElementById("text" + i).classList.toggle("show");
        document.getElementById("exam" + i).classList.remove("show");
    }

    function showExam(i) {
        let examBox = document.getElementById("exam" + i);
        let textBox = document.getElementById("text" + i);
        let viewBtn = document.getElementById("viewBtn_" + i);
        if (examBox.classList.contains("show")) {
            // 关闭考核
            examBox.classList.remove("show");
            examActiveSet.delete(i);
            delete examCache[i]; // 清除缓存
            if (viewBtn) viewBtn.style.display = 'inline-block';
            resetExamInputs(i);
        } else {
            // 打开考核：生成新题目并缓存
            let newExercises = generateExercises(poems[i]);
            examCache[i] = newExercises;
            examActiveSet.add(i);
            if (viewBtn) viewBtn.style.display = 'none';
            if (textBox) textBox.classList.remove("show");
            // 重新渲染该卡片以显示新题目
            render();
            return;
        }
        render();
    }

    function submitExam(index) {
        let p = poems[index];
        let exList = examCache[index];
        if (!exList) {
            alert("题目数据丢失，请重新打开考核");
            return;
        }
        let allCorrect = true;
        exList.forEach((ex, qIdx) => {
            let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
            let errEl = document.getElementById(`err_${index}_${qIdx}`);
            if (!inputEl) return;
            let userAns = inputEl.value.trim().replace(/[，,。.！!？?；;：:、""''（）《》【】\s]/g, "");
            let standardAns = ex.expected.replace(/[，,。.！!？?；;：:、""''（）《》【】\s]/g, "");
            if (userAns === standardAns && userAns !== "") {
                inputEl.style.borderColor = "#67c23a";
                errEl.style.display = "none";
            } else {
                inputEl.style.borderColor = "#f56c6c";
                errEl.style.display = "inline";
                allCorrect = false;
            }
        });

        if (allCorrect) {
            document.getElementById('success_' + index).style.display = "block";
            poems[index].done = true;
            save();
            examActiveSet.delete(index);
            delete examCache[index];
            let viewBtn = document.getElementById('viewBtn_' + index);
            if (viewBtn) viewBtn.style.display = 'inline-block';
            exList.forEach((ex, qIdx) => {
                let inputEl = document.getElementById(`ans_${index}_${qIdx}`);
                if (inputEl) inputEl.disabled = true;
            });
            setTimeout(() => { render(); }, 1200);
        } else {
            document.getElementById('success_' + index).style.display = "none";
        }
    }

    function cancelCheck(i) {
        poems[i].done = false;
        examActiveSet.delete(i);
        delete examCache[i];
        save();
        render();
    }

    function darkMode() {
        document.body.classList.toggle("dark");
    }

    document.getElementById("gradeSelect").onchange = render;
    document.getElementById("search").oninput = render;
    render();
</script>
</body>
